name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: dcal
    steps:
      # dcal runner 即本机,宿主 node 22 就是构建用的那份;不再 setup-node(免外部下载,npm 缓存本就共享)
      - uses: actions/checkout@v4
      - run: node -v && npm -v
      - run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 前端静态检查
        run: npm test

  release:
    # 打 v* tag 时:打包源码 tarball 并发布 Gitea Release。
    # 发版分工（2026-11-06 收敛）：源码 tarball 只在这里发、APK 只在 flutter-apk.yml 发——
    # 此前 ci.yml 的 apk job 与 flutter-apk.yml 的 tag 路径是两条并行发 APK 的路，同一 Release
    # 有创建竞争；且 APP 节奏独立于 server 后 tag 匹配 pubspec 而非 package.json 会让本 job 硬失败。
    # 现在：tag==package.json → 同步发版（发 tarball）；tag==pubspec → APP-only 发版（跳过 tarball，
    # APK 由 flutter-apk.yml 发）；都不匹配 → 失败（乱打的 tag）。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: dcal
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 判定发版类型
        id: kind
        run: |
          PKG_VER="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VER" = "${GITHUB_REF_NAME}" ]; then
            echo "kind=full" >> "$GITHUB_OUTPUT"
            echo "同步发版: ${GITHUB_REF_NAME}（源码 tarball + APK[flutter-apk.yml]）"
          else
            PUB_VER="v$(sed -n 's/^version:[[:space:]]*//p' app/pubspec.yaml | head -1 | cut -d+ -f1)"
            if [ "$PUB_VER" = "${GITHUB_REF_NAME}" ]; then
              echo "::notice::APP-only 发版（tag 匹配 pubspec=${PUB_VER}，package.json=${PKG_VER}）——跳过源码 tarball"
              echo "kind=app-only" >> "$GITHUB_OUTPUT"
            else
              echo "tag ${GITHUB_REF_NAME} 与 package.json(${PKG_VER})、pubspec(${PUB_VER}) 都不一致"; exit 1
            fi
          fi
      - name: 打包 tarball（git archive，解包后 npm ci && systemctl start harnessgate）
        if: steps.kind.outputs.kind == 'full'
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix=harnessgate-${GITHUB_REF_NAME}/ -o dist/harnessgate-${GITHUB_REF_NAME}.tar.gz HEAD
      - name: 发布 Release 并附 tarball
        if: steps.kind.outputs.kind == 'full'
        env:
          RELEASE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-release-attach.sh dist/*.tar.gz
