name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 前端静态检查
        run: npm test

  apk:
    # 打 v* tag 时：构建 Android APK 附到 Release（APP 内自更新就是下载这个）。
    # 在 release job 之后跑：先建好 Release 再追加 APK，避免并行创建竞争。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 依赖与分析/测试
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: 注入固定签名密钥（与本地同一份，保证版本间签名一致可覆盖安装）
        env:
          HG_KEYSTORE_BASE64: ${{ secrets.HG_KEYSTORE_BASE64 }}
          HG_KEYSTORE_PROPERTIES: ${{ secrets.HG_KEYSTORE_PROPERTIES }}
        run: |
          echo "$HG_KEYSTORE_BASE64" | base64 -d > app/android/app/harnessgate-release.jks
          printf '%s' "$HG_KEYSTORE_PROPERTIES" > app/android/app/key.properties
      - name: 构建 Release APK
        working-directory: app
        run: flutter build apk --release
      - name: 重命名并附到 Release
        run: |
          mkdir -p dist
          mv app/build/app/outputs/flutter-apk/app-release.apk dist/harnessgate-${GITHUB_REF_NAME}-android.apk
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

  release:
    # 打 v* tag 时：打包源码 tarball 并发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 校验 tag 与 package.json 版本一致
        run: |
          PKG_VER="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VER" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} 与 package.json 版本 $PKG_VER 不一致"; exit 1
          fi
      - name: 打包 tarball（git archive，解包后 npm ci && systemctl start harnessgate）
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix=harnessgate-${GITHUB_REF_NAME}/ -o dist/harnessgate-${GITHUB_REF_NAME}.tar.gz HEAD
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.tar.gz
