name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 前端静态检查
        run: npm test

  release:
    # 打 v* tag 时：打包源码 tarball 并发布 GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 校验 tag 与 package.json 版本一致
        run: |
          PKG_VER="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VER" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} 与 package.json 版本 $PKG_VER 不一致"; exit 1
          fi
      - name: 打包 tarball（git archive，解包后 npm ci && systemctl start harnessgate）
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix=harnessgate-${GITHUB_REF_NAME}/ -o dist/harnessgate-${GITHUB_REF_NAME}.tar.gz HEAD
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.tar.gz
