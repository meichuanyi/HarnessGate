/* =====================================================================
   定时任务：列表 + 编辑器（频率+窗口两层模型 → cron，croner 求值）
   ===================================================================== */
function cadenceDescWeb(c) {
  if (!c) return "?";
  const wd = (days) => (days || []).map((d) => "日一二三四五六"[d] ?? d).join("/");
  if (c.type === "daily") return "每天 " + c.at;
  if (c.type === "interval") return "每 " + c.everyMinutes + " 分钟";
  if (c.type === "weekly") return "每周" + wd(c.days) + " " + c.at;
  if (c.type === "cron") return "cron: " + c.expr;
  return "?";
}
const LAST_STATUS = { ok: "✓ 成功", error: "✕ 出错", "contract-fail": "✕ 契约未满足", timeout: "⏱ 超时", "skipped-running": "跳过（上次仍在跑）", "missing-files": "✕ 缺前置文件" };

/* ---------- 从会话整理定时任务：分段 → 选段 → AI 蒸馏 → 表单 ---------- */
let schedPick = null;    // { sessionId, segments:[{head,fromTs,toTs,turns,spanMin,score}] }
let schedDistill = null; // { sessionId, seg, text } 蒸馏进行中（text 累积流式）

const CHATTER_RE = /^(继续|继续吧|好的?|好嘞|嗯+|行|可以|ok|OK|Ok|收到|对|是|没错|go|Go|开始|继续干).{0,6}$/;
// 时间/动作信号：带这些词的短消息不是闲聊（"晚上8点提醒我打球"只有 9 个字，却是最典型的定时任务）
const TASKISH_RE = /(提醒|记得|别忘|每天|每周|每月|每小时|每隔|定时|到点|\d+\s*[点:：]|明[天早晚]|今[天晚]|今晚|早上|晚上|中午|小时后)/;

function segmentSession(ents) {
  const segs = [];
  let cur = null, prevTs = 0;
  for (const e of ents) {
    if (e.kind !== "user") continue;
    const t = (e.text || "").trim();
    if (!t) continue;
    const ts = new Date(e.ts).getTime();
    const taskish = TASKISH_RE.test(t);
    const chatter = !taskish && (t.length < 12 || CHATTER_RE.test(t));
    const gap = prevTs ? ts - prevTs : Infinity;
    if (!cur || (!chatter && (t.length >= 30 || taskish || gap > 30 * 60_000))) {
      cur = { head: t.slice(0, 80), fromTs: e.ts, toTs: e.ts, turns: 0, taskish };
      segs.push(cur);
    }
    cur.toTs = e.ts;
    cur.turns++;
    prevTs = ts;
  }
  const now2 = Date.now();
  for (const g of segs) {
    g.spanMin = Math.round((new Date(g.toTs).getTime() - new Date(g.fromTs).getTime()) / 60000);
    // 推荐指数：提醒类是定时任务的原型；跨天的多轮任务次之；一次性小修/纯问答降权
    g.score = 0;
    if (g.taskish) g.score += 2;
    if (g.spanMin > 20 * 60) g.score += 2;
    else if (g.spanMin > 60) g.score += 1;
    if (g.turns >= 3 && g.turns <= 20) g.score += 1;
    if (g.head.length >= 30) g.score += 1;
    if (now2 - new Date(g.toTs).getTime() > 7 * 864e5) g.score -= 1;   // 太老的段降权
  }
  return segs.filter((g) => g.turns >= 2 || g.head.length >= 30 || g.taskish).slice(-4).reverse();
}

function startSchedFromSession(s) {
  const segs = segmentSession(entries);
  if (!segs.length) {
    // 本地规则切不出段：会话在运行就自动交给 AI 精切兜底，别硬拒绝
    if (s.live) {
      schedPick = { sessionId: s.id, segments: [], aiBusy: true };
      schedEdit = null;
      state.view = "schedules";
      render();
      send({ type: "schedule-segment", sessionId: s.id });
      showToast("本地切分没找到任务段，已转 AI 精切…", 3000);
    } else {
      showToast("⚠ 这条会话里没找到适合定时化的任务段（恢复会话后可试 AI 精切）", 4500);
    }
    return;
  }
  if (segs.length === 1) { distillSegment(s, segs[0]); return; }   // 只有一段：跳过选择直接蒸馏
  schedPick = { sessionId: s.id, segments: segs };
  schedEdit = null;
  state.view = "schedules";
  render();
}

          <label>产出契约：前置文件</label><input type="text" id="seRequires" value="${esc((e.contract?.requires || []).join(", "))}" placeholder="scripts/fetch.py, score.py（逗号分隔，可空）" style="flex:1;min-width:200px" />
        </div>
        <div class="row">
          <label>产出契约：产物文件</label><input type="text" id="seOutput" value="${esc(e.contract?.outputFile || "")}" placeholder="日报-{{date}}.md（可空；跑完校验存在且非空）" style="flex:1;min-width:200px" />
        </div>
        <div class="row">
          <label><input type="checkbox" id="seEnabled"${e.enabled !== false ? " checked" : ""} style="width:auto"> 启用</label>
          <span style="flex:1"></span>
          <button class="mini" id="seCancel">取消</button>
          <button class="btn primary" id="seSave">保存</button>
        </div>
      </div>
    </div>`;

  const dyn = () => {
    const t = $("seCadType").value;
    const box = $("seCadDyn");
    const cur = e.cadence || {};
    if (t === "daily") box.innerHTML = '每天 <input type="time" id="seAt" value="' + esc((ct === "daily" && cur.at) || "09:00") + '" />';
    else if (t === "interval") box.innerHTML = '每 <input type="number" id="seEvery" min="1" value="' + esc(String((ct === "interval" && cur.everyMinutes) || 60)) + '" style="width:70px" /> 分钟（窗口外自动顺延）';
    else if (t === "weekly") box.innerHTML = '每周 ' + wdBoxes + ' <input type="time" id="seAt" value="' + esc((ct === "weekly" && cur.at) || "09:00") + '" />';
    else box.innerHTML = '<input type="text" id="seExpr" value="' + esc((ct === "cron" && cur.expr) || "0 9 * * 1-5") + '" placeholder="分 时 日 月 周" style="width:180px" />';
  };
  $("seCadType").onchange = dyn;
  dyn();

  $("seCancel").onclick = () => { schedEdit = null; renderSchedules(); };
  $("seSave").onclick = () => {
    const t = $("seCadType").value;
    let cadence;
    try {
      if (t === "daily") cadence = { type: "daily", at: $("seAt").value || "09:00" };
      else if (t === "interval") cadence = { type: "interval", everyMinutes: Number($("seEvery").value) || 60 };
      else if (t === "weekly") {
        const days = [...root.querySelectorAll(".seWd:checked")].map((x) => Number(x.value));
        if (!days.length) { alertLike2("每周频率至少选一天"); return; }
        cadence = { type: "weekly", days, at: $("seAt").value || "09:00" };
      } else cadence = { type: "cron", expr: $("seExpr").value.trim() };
    } catch (err) { alertLike2(String(err.message || err)); return; }
    const winFrom = $("seWinFrom").value, winTo = $("seWinTo").value;
    const weekdays = [...root.querySelectorAll(".seWd:checked")].map((x) => Number(x.value));
    const window = (winFrom || winTo || weekdays.length) ? { from: winFrom || undefined, to: winTo || undefined, weekdays: weekdays.length ? weekdays : undefined } : undefined;
    const spec = {
      id: e.id, name: $("seName").value.trim(), enabled: $("seEnabled").checked,
      harnessId: $("seHarness").value, cwd: $("seCwd").value.trim(),
      autoApprove: $("seAA").value, sessionMode: $("seSessionMode").value,
      cadence, window, overlap: "skip",
      promptTemplate: $("sePrompt").value,
      contract: { requires: $("seRequires").value.split(",").map((x) => x.trim()).filter(Boolean), outputFile: $("seOutput").value.trim() || undefined },
    };
    if (!spec.name) { alertLike2("先起个名字"); return; }
    send({ type: "schedule-save", schedule: spec });
    schedEdit = null;
  };
}
function alertLike2(msg) {
  showToast("⚠ " + msg, 3500);
}

function renderRoundtable() {
  const root = $("viewRoot");
  const room = state.roomId ? roomById(state.roomId) : null;
  if (!room) {
    root.innerHTML = roomWizardHtml();
    bindRoomWizard();
    return;
  }
  if (root.querySelector("#rtBlocks") && root.dataset.roomId === room.id) {
    syncRoomBlocks(room);
    updateRoomHead(room);
    return;
  }
  root.innerHTML = roomDetailHtml(room);
  root.dataset.roomId = room.id;
  rtLiveBuf.clear();
  bindRoomDetail(room);
  syncRoomBlocks(room);
  updateRoomHead(room);   // 全量渲染也要走一遍：停止/出错时的「继续运行」按钮在这里注入
  tickLiveTags();         // 活性标签立即填充，不等第一个 5 秒 tick
}

function updateRoomHead(room) {
  const head = document.querySelector(".rtHead");
  if (!head) return;
  const pill = head.querySelector(".pill");
  if (pill) {
    pill.textContent = ROOM_STATUS[room.status] || room.status;
    pill.className = `pill ${room.status === "done" ? "done" : room.status === "running" ? "running" : room.status === "error" ? "error" : "saved"}`;
  }
  const hasStop = !!head.querySelector("#rtStop");
  if (room.status === "running" && !hasStop) {
    const b = document.createElement("button");
    b.className = "mini"; b.id = "rtStop"; b.textContent = "停止";
    b.onclick = () => send({ type: "room-stop", roomId: room.id });
    head.appendChild(b);
  } else if (room.status !== "running" && hasStop) {
    head.querySelector("#rtStop").remove();
  }
  // 断点续跑：停止/出错且没到终态 → 可以「继续运行」（讨论从第一个未完成轮继续，工作队保留任务板）
  const hasRun = !!head.querySelector("#rtRun");
  const resumable = room.status === "stopped" || room.status === "error";
  if (resumable && !hasRun) {
    const b = document.createElement("button");
    b.className = "primary mini"; b.id = "rtRun"; b.textContent = "▶ 继续运行";
    b.title = room.crew ? "保留任务板继续：被打断的任务退回待办，已完成的直接进评审/合并" : "从第一个未完成的轮继续（该轮残缺发言会重说）";
    b.onclick = () => send({ type: "room-run", roomId: room.id });
    head.appendChild(b);
  } else if (!resumable && hasRun) {
    head.querySelector("#rtRun").remove();
  }
}

function cfgList(map) {
  return Object.entries(map ?? {}).map(([configId, value]) => ({ configId, value }));
}

/* 主持人/工头自己的模型与参数（和服务端 room-start 的 host.configs 对齐） */
function hostConfigsHtml() {
  const h = harnesses.get(state.rtHost);
  if (!h) return "";
  const cfgs = (h.configs ?? []).filter((c) => c.options?.length);
  if (!cfgs.length) {
    return `<div class="meta2" style="margin-top:7px">${esc(h.label)} 没有上报可切换的配置项（模型等用默认值）${h.state === "probed-ok" ? "" : "（未探活，跑一次 doctor --probe --deep 可拿到目录）"}</div>`;
  }
  const sels = cfgs.map((c) => {
    const cur = state.rtHostCfg[c.id] ?? c.currentValue ?? "";
    const opts = c.options.map((o) =>
      `<option value="${esc(o.value)}" ${o.value === cur ? "selected" : ""}>${esc(o.name)}</option>`).join("");
    return `<label>${esc(c.name)}<select data-hcfg="${esc(c.id)}">${opts}</select></label>`;
  }).join("");
  return `<div style="margin-top:8px;display:flex;gap:12px;flex-wrap:wrap;font-size:12px">${sels}</div>`;
}

function memberConfigsHtml(picked) {
  if (!picked.length) return "";
  const rows = picked.map((id) => {
    const h = harnesses.get(id);
    const cfgs = h?.configs ?? [];
    const hostNote = state.rtHost === id ? '<span class="badge host">主持</span>' : "";
    if (!cfgs.length) {
      return `<div class="row"><span class="nm">${esc(h?.label || id)}</span>${hostNote}
        <span class="meta2">这个 harness 没报告可切换的配置项${h?.state === "probed-ok" ? "" : "（还没探活，跑一次 doctor --probe --deep）"}</span></div>`;
    }
    const sels = cfgs.map((c) => {
      const cur = state.rtMemberCfg[id]?.[c.id] ?? c.currentValue ?? "";
      const opts = c.options.map((o) =>
        `<option value="${esc(o.value)}" ${o.value === cur ? "selected" : ""}>${esc(o.name)}</option>`).join("");
      return `<label>${esc(c.name)}<select data-mcfg="${esc(id)}" data-cfg="${esc(c.id)}">${opts}</select></label>`;
    }).join("");
    const agents = h?.extraAgents ?? [];
    const agentSel = agents.length
      ? `<label>OpenClaw agent<select data-mvar="${esc(id)}" data-var="HG_OPENCLAW_AGENT">${agents.map((a) =>
          `<option value="${esc(a)}" ${a === (state.rtMemberVars[id] ?? "main") ? "selected" : ""}>${esc(a)}</option>`).join("")}</select></label>`
      : "";
    return `<div class="row"><span class="nm">${esc(h?.label || id)}</span>${hostNote}${sels}${agentSel}</div>`;
  }).join("");
  return `<div class="memberCfg">
    <h3 style="margin:0 0 4px;font-size:13px;color:var(--dim)">成员配置（可选，建会话时自动应用）</h3>
    <div class="meta2" style="margin-bottom:8px">列表来自各 harness 自己上报的目录，<b>不保证下游真的支持</b>——换完发现报「Invalid model name」就说明这个模型名你的 provider 不认，换回默认即可。</div>
    ${rows}</div>`;
}

function bindRoomWizard() {
  const next = (n) => { state.rtStep = n; renderRoundtable(); };
  if (state.rtStep === 1) {
    const input = $("rtCwd");
    attachDirComplete(input, { click: () => next(2) });
    input.addEventListener("input", () => {
      state.rtCwd = input.value;
      const btn = $("rtNext1");
      if (btn) btn.disabled = !input.value.trim();
    });
    $("rtNext1").onclick = () => { state.rtCwd = input.value.trim(); next(2); };
    // 开会方式（工作队/圆桌讨论）在第一步就确定
    document.querySelectorAll("#viewRoot .pick[data-kind]").forEach((el) => {
      el.onclick = () => { state.rtKind = el.dataset.kind; renderRoundtable(); };
    });
  } else if (state.rtStep === 2) {
    $("rtBack2").onclick = () => next(1);
    $("rtNext2").onclick = () => next(3);
    $("rtPick").querySelectorAll(".pick").forEach((el) => {
      el.onclick = () => {
        const id = el.dataset.h;
        if (state.rtPicked.has(id)) state.rtPicked.delete(id); else state.rtPicked.add(id);
        if (state.rtHost === id && !state.rtPicked.has(id)) state.rtHost = "";
        renderRoundtable();
      };
    });
    $("viewRoot").querySelectorAll("select[data-mcfg]").forEach((sel) => {
      sel.onchange = () => {
        const hid = sel.dataset.mcfg, cid = sel.dataset.cfg;
        state.rtMemberCfg[hid] = { ...(state.rtMemberCfg[hid] ?? {}), [cid]: sel.value };
      };
    });
    $("viewRoot").querySelectorAll("select[data-mvar]").forEach((sel) => {
      sel.onchange = () => {
        const hid = sel.dataset.mvar;
        state.rtMemberVars[hid] = { ...(state.rtMemberVars[hid] ?? {}), [sel.dataset.var]: sel.value };
      };
    });
    $("rtHost").onchange = (e) => { state.rtHost = e.target.value; state.rtHostCfg = {}; renderRoundtable(); };
    $("viewRoot").querySelectorAll("select[data-hcfg]").forEach((sel) => {
      sel.onchange = () => { state.rtHostCfg = { ...(state.rtHostCfg ?? {}), [sel.dataset.hcfg]: sel.value }; };
    });
    if ($("rtHostOpening")) $("rtHostOpening").onchange = (e) => { state.rtHostOpening = e.target.checked; };
    if ($("rtHostRound")) $("rtHostRound").onchange = (e) => { state.rtHostRound = e.target.checked; };
    if ($("rtHostFinal")) $("rtHostFinal").onchange = (e) => { state.rtHostFinal = e.target.checked; };
    if ($("rtHostStyle")) $("rtHostStyle").onchange = (e) => { state.rtHostStyle = e.target.value; };
  } else {
    $("rtBack3").onclick = () => next(2);
    const updRoundsHint = () => {
      const el = $("rtRoundsHint");
      if (!el || state.rtKind === "crew") { if (el) el.textContent = ""; return; }
      const conv = $("rtConverge")?.checked, tour = $("rtTournament")?.checked;
      const n = Number($("rtRounds").value);
      const tourNote = tour ? " · 评分锦标赛" : "";
      el.textContent = n === 0
        ? ` · 轮数无上限${conv ? " · 共识即停（至少 2 轮）" : " · 只能手动停止"}${hostNote}${tourNote}`
        : ` · 最多 ${n} 轮${conv ? " · 共识即停（至少 2 轮）" : ""}${tourNote}`;
    };
    $("rtRounds").onchange = updRoundsHint;
    $("rtConverge").onchange = updRoundsHint;
    $("rtTournament").onchange = updRoundsHint;
    updRoundsHint();
    $("rtGo").onclick = () => {
      const topic = $("rtTopic").value.trim();
      if (!topic) { alert(state.rtKind === "crew" ? "先写下目标" : "先写议题"); return; }
      const ids = [...state.rtPicked].filter((id) => { const h = harnesses.get(id); return h && (h.available || h.binPath); });
      if (ids.length < 2) { alert("至少选两个 harness"); return; }
      const isCrew = state.rtKind === "crew";
      const rounds = Number($("rtRounds").value);   // 0 = 无上限（仅讨论模式）
      const hostId = state.rtHost || ids.find((id) => harnesses.get(id)?.available) || "";
      if (!hostId) { alert(isCrew ? "请选择工头" : "请选择主持人"); return; }
      send({
        type: "room-start",
        cwd: state.rtCwd.trim(),
        harnessIds: ids,
        topic,
        rounds,
        mode: $("rtMode")?.value || "parallel",
        converge: isCrew ? undefined : $("rtConverge")?.checked,
        tournament: isCrew ? undefined : $("rtTournament")?.checked,
        writeAllowed: isCrew ? true : Boolean($("rtWrite")?.checked),
        crew: isCrew ? { maxAttempts: 2, mergeMode: $("rtMergeMode")?.value || "manual" } : undefined,
        host: {
          harnessId: hostId,
          opening: isCrew ? false : state.rtHostOpening,
          roundSummary: isCrew ? false : state.rtHostRound,
          finalSummary: true,
          style: isCrew ? "convergent" : state.rtHostStyle,
          configs: cfgList({ ...(state.rtMemberCfg[hostId] ?? {}), ...(state.rtHostCfg ?? {}) }),
          vars: state.rtMemberVars[hostId],
        },
        memberConfigs: Object.fromEntries(
          ids.map((id) => [id, cfgList(state.rtMemberCfg[id])]).filter(([, v]) => v.length),
        ),
        memberVars: Object.fromEntries(
          ids.map((id) => [id, state.rtMemberVars[id] ?? {}]).filter(([, v]) => Object.keys(v).length),
        ),
      });
      pendingRoomStart = true;
      $("rtGo").disabled = true;
      $("rtGo").textContent = "正在建会话…";
    };
  }
  const wrap = $("viewRoot");
  wrap.querySelectorAll("button[data-open]").forEach((b) => {
    b.onclick = () => { state.roomId = b.dataset.open; renderRoundtable(); };
  });
  wrap.querySelectorAll("button[data-del]").forEach((b) => {
    b.onclick = () => askRoomDelete(b.dataset.del);
  });
}

/* ---------- 讨论区：发言流 + 继续追问 ---------- */

  const topics = roomTopics(room);

        <span class="pill ${room.status === "done" ? "done" : room.status === "running" ? "running" : room.status === "error" ? "error" : "saved"}">${ROOM_STATUS[room.status] || room.status}</span>
        <span style="flex:1"></span>

      </div>

        · ${room.writeAllowed ? "允许改文件" : "只讨论不改文件"}
        · ${last.rounds === 0 ? "轮数无上限" : `最多 ${last.rounds} 轮`}${last.converge === false ? "" : " · 共识即停"}${last.tournament ? " · 评分锦标赛" : ""}${last.convergedRound ? `（第 ${last.convergedRound} 轮收敛 ✓）` : ""}
        ${room.error ? ` · <span style="color:var(--err)">${esc(room.error)}</span>` : ""}
      </div>

      ${busy ? `
      <div class="rtCard" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 14px">
        <span class="cfgl">下一轮发言方式</span>
        <div class="seg" id="rtModeSeg">
          <button data-m="parallel" class="${(last.mode ?? "parallel") === "parallel" ? "on" : ""}">并行</button>
          <button data-m="sequential" class="${last.mode === "sequential" ? "on" : ""}">串行</button>
        </div>
        <span class="meta2">切换从下一轮生效；并行时同轮所有人拿到相同的输入，适合横向对比</span>
      </div>` : ""}

      <div id="rtBlocks">${topicBlocksHtml(room, last)}</div>

      ${topics.length > 1 ? `<div class="rtCard"><h3>此前的议题（${topics.length - 1}）</h3>
        ${topics.slice(0, -1).map((t, i) => `<div class="rtPastTopic"><b>议题 ${i + 1}：${esc(t.topic)}</b>
          <span class="rtBadge">${t.turns.length} 次发言 · ${ROOM_STATUS[t.status] || t.status}</span>
          <details><summary>展开</summary>${topicBlocksHtml(room, t)}</details></div>`).join("")}
      </div>` : ""}

      <div class="rtCard">
        <h3>继续追问（同一批成员，接着聊下一个议题）</h3>
        <textarea class="rtTopic" id="rtTopic2" placeholder="新的议题…（成员会带着前面讨论的上下文继续）" ${busy ? "disabled" : ""}></textarea>
        <div style="display:flex;gap:12px;align-items:center;margin-top:11px;flex-wrap:wrap;font-size:12px">
          <label class="cfgl">最多轮数 <select id="rtRounds2" style="width:auto" ${busy ? "disabled" : ""}>
            ${[1, 2, 3, 4, 5, 6, 7, 8].map((n) => `<option value="${n}" ${n === 3 ? "selected" : ""}>${n}</option>`).join("")}
            <option value="0">无上限 ∞</option>
          </select></label>
          <label class="cfgl" style="display:flex;align-items:center;gap:4px" title="主持人判定收敛后提前结束；至少 2 轮"><input type="checkbox" id="rtConverge2" style="width:auto" ${room.converge === false ? "" : "checked"} ${busy ? "disabled" : ""} />共识即停</label>
          <label class="cfgl" style="display:flex;align-items:center;gap:4px" title="主持人逐轮打分，高分摘录更全，最终按累计分加权"><input type="checkbox" id="rtTournament2" style="width:auto" ${room.tournament ? "checked" : ""} ${busy ? "disabled" : ""} />评分锦标赛</label>
          <label class="cfgl">方式 <select id="rtMode2" ${busy ? "disabled" : ""} style="width:auto">
            <option value="parallel">并行</option><option value="sequential">串行</option></select></label>
          <label class="cfgl" style="display:flex;align-items:center;gap:4px"><input type="checkbox" id="rtWrite2" style="width:auto" ${room.writeAllowed ? "checked" : ""} ${busy ? "disabled" : ""} />允许改文件</label>

function roomMembers(room) {
  return room.memberInfo?.length
    ? room.memberInfo
    : (room.members || []).map((id) => {
        const s = sessions.get(id);
        return { sessionId: id, harnessId: s?.harnessId, harnessLabel: s?.harnessLabel || id };
      });
}

function roomTopics(room) {
  return room.topics?.length
    ? room.topics
    : [{ id: "t0", topic: room.topic, rounds: room.rounds, mode: room.mode, status: room.status, turns: room.turns || [], createdAt: room.createdAt }];
}

function topicBlocksHtml(room, topic) {
  const members = roomMembers(room);
  const hostId = room.host?.sessionId;
  const turns = topic.turns || [];
  const opening = turns.find((t) => t.hostRole === "opening");
  const final = turns.find((t) => t.hostRole === "final");
  const started = topic.status === "running" ? (topic.currentRound ?? 0) : (topic.rounds || 0);
  // 无上限（rounds=0）：轮次块按实际发生的轮数动态出现，不预定
  const unlimited = !topic.rounds;
  const total = unlimited
    ? Math.max(topic.currentRound ?? 0, turns.reduce((m, t) => Math.max(m, t.round), 0), topic.convergedRound ?? 0)
    : topic.rounds;
  const blocks = [];

  if (opening) blocks.push(hostBlockHtml(room, opening, "①"));

  for (let r = 1; r <= total; r++) {
    const isPending = topic.status === "running" && r > started;
    const isActive = topic.status === "running" && r === started;
    const roundTurns = turns.filter((t) => t.kind !== "host" && t.round === r);
    const mode = topic.mode ?? "parallel";
    blocks.push(`
      <section class="rtRound ${isActive ? "active" : ""} ${isPending ? "pending" : ""}" data-round="${r}">
        <div class="rtRoundHead">
          <span class="rn">第 ${r} 轮</span>
          <span class="badge">${mode === "parallel" ? "并行" : "串行"}</span>
          ${topic.convergedRound === r ? '<span class="badge" style="color:var(--ok);border-color:#1f4a28">✓ 收敛</span>' : ""}
          ${isActive ? '<span class="meta2">进行中…</span>' : isPending ? '<span class="meta2">等待中</span>' : `<span class="meta2">${roundTurns.length} 条发言</span>`}
        </div>
        <div class="rtCols" data-cols="${r}">
          ${members.map((m) => {
            const my = roundTurns.filter((t) => t.sessionId === m.sessionId);
            return `
              <div class="rtCol" data-col="${r}:${esc(m.sessionId)}">
                <div class="rtColHead">
                  <span class="nm" title="${esc(m.harnessId || "")}">${esc(m.harnessLabel)}</span>
                  ${m.sessionId === hostId ? '<span class="badge host">主持</span>' : ""}
                  <span class="st" data-st="${r}:${esc(m.sessionId)}"></span>
                </div>
                <div class="rtColBody" data-body="${r}:${esc(m.sessionId)}">
                  ${my.map((t) => rtTurnHtml(t)).join("") || (isPending ? '<div class="meta2" style="padding:8px">等前面几轮结束</div>' : '<div class="meta2" style="padding:8px">还没有发言</div>')}
                  <div class="rtLive" data-live="${r}:${esc(m.sessionId)}" hidden></div>
                </div>
              </div>`;
          }).join("")}
        </div>
      </section>`);

    const summary = turns.find((t) => t.hostRole === "round-summary" && t.round === r);
    if (summary && (unlimited || r < topic.rounds)) {
      blocks.push(hostBlockHtml(room, summary, `第 ${r} 轮小结${topic.convergedRound === r ? "（判定收敛，提前结束）" : ""}`));
    }
  }

  if (final) blocks.push(hostBlockHtml(room, final, "最终总结"));
  return blocks.join("");
}

function hostBlockHtml(room, t, label) {
  return `
    <section class="rtHostBlock">
      <div class="rtRoundHead"><span class="rn host">${esc(label)}</span>
        <span class="badge host">${esc(room.host?.harnessLabel || t.harnessLabel)}</span>
        <span class="meta2">${new Date(t.ts).toLocaleTimeString()}</span>
        <button class="mini ghost" data-prompt="${esc(t.ts)}" style="padding:1px 6px;font-size:11px">看 prompt</button>
      </div>
      <div class="rtHostBody">
        <div class="txt md">${mdToHtml(t.reply || "(无输出)")}</div>
        <pre data-promptFor="${esc(t.ts)}" hidden style="white-space:pre-wrap;font-size:11.5px;color:var(--dim2);margin:7px 0 0">${esc(t.prompt)}</pre>
      </div>
    </section>`;
}

function rtTurnHtml(x) {
  return `
    <div class="rtTurn" data-turn="${esc(x.sessionId)}-${x.round}-${esc(x.ts)}">
      ${x.score != null ? `<div class="rtScore" title="${esc(x.scoreNote || "")}">★ ${x.score}/10${x.scoreNote ? ` · ${esc(clipNote(x.scoreNote))}` : ""}</div>` : ""}
      <div class="txt md">${mdToHtml(x.reply || "(无输出)")}</div>
    </div>`;
}

function clipNote(s) { return s.length > 60 ? s.slice(0, 60) + "…" : s; }

const rtLiveBuf = new Map();

function rtActiveRound(room) {
  const topics = roomTopics(room);
  const last = topics[topics.length - 1];
  if (last.status !== "running") return null;
  return last.currentRound ?? null;
}

function applyRoomUpdate(sessionId, u) {
  if (!sessionId || state.view !== "roundtable" || !state.roomId) return;
  const room = roomById(state.roomId);
  if (!room) return;
  if (!roomMembers(room).some((m) => m.sessionId === sessionId)) return;
  noteSessionEvent(sessionId);   // 活性标签：圆桌成员的任何事件都算「活着」

  if (room.crew) {
    // 工作队：流式按 sessionId 直达 worker 栏
    if (u.sessionUpdate === "agent_message_chunk" && u.content?.type === "text" && u.content.text) {
      const buf = (rtLiveBuf.get(sessionId) ?? "") + u.content.text;
      rtLiveBuf.set(sessionId, buf);
      const box = document.querySelector(`.rtLive[data-live="${sessionId}"]`);
      if (box) {
        box.hidden = false;
        box.innerHTML = `<div class="who">干活中…</div><div class="txt md">${mdToHtml(buf)}</div>`;
      }
      setCrewStatus(sessionId, "干活中");
      return;
    }
    if (u.sessionUpdate === "agent_thought_chunk") { setCrewStatus(sessionId, "思考中…"); return; }
    if (u.sessionUpdate === "tool_call" || u.sessionUpdate === "tool_call_update") {
      setCrewStatus(sessionId, `工具: ${String(u.title ?? "").slice(0, 22)}`);
      return;
    }
    return;
  }

  const round = rtActiveRound(room);
  const hostId = room.host?.sessionId;

  if (u.sessionUpdate === "agent_message_chunk" && u.content?.type === "text" && u.content.text) {
    const key = `${round ?? 0}:${sessionId}`;
    const buf = (rtLiveBuf.get(key) ?? "") + u.content.text;
    rtLiveBuf.set(key, buf);
    const box = document.querySelector(`.rtLive[data-live="${key}"]`);
    if (box) {
      box.hidden = false;
      box.innerHTML = `<div class="who">生成中…</div><div class="txt md">${mdToHtml(buf)}</div>`;
    } else if (round === 0 || sessionId === hostId) {
      let ph = document.querySelector(".rtHostBlock.liveHost");
      if (!ph) {
        ph = document.createElement("section");
        ph.className = "rtHostBlock liveHost";
        ph.innerHTML = `<div class="rtRoundHead"><span class="rn host">主持人</span>
          <span class="badge host">${esc(room.host?.harnessLabel || "")}</span><span class="meta2">生成中…</span></div>
          <div class="rtHostBody"><div class="txt md"></div></div>`;
        const blocks = document.querySelector("#rtBlocks");
        if (blocks) blocks.appendChild(ph);
      }
      const body = ph.querySelector(".txt");
      if (body) body.innerHTML = mdToHtml(buf);
    }
    setColStatus(round ?? 0, sessionId, "生成中");
    return;
  }
  if (u.sessionUpdate === "tool_call" || u.sessionUpdate === "tool_call_update") {
    const title = String(u.title ?? u.toolCallId ?? "工具");
    setColStatus(round ?? 0, sessionId, `工具: ${title.slice(0, 22)}`);
    return;
  }
  if (u.sessionUpdate === "agent_thought_chunk") {
    setColStatus(round ?? 0, sessionId, "思考中…");
    return;
  }
}

function setColStatus(round, sessionId, text) {
  const el = document.querySelector(`.st[data-st="${round}:${sessionId}"]`);
  if (el) el.textContent = text;
}

function syncRoomBlocks(room) {
  const container = document.querySelector("#rtBlocks");
  if (!container) return;
  if (room.crew) { syncCrewBlocks(room); return; }
  const topics = roomTopics(room);
  const last = topics[topics.length - 1];
  const busy = room.status === "running";
  const active = rtActiveRound(room);

  container.innerHTML = topicBlocksHtml(room, last);

  for (const key of [...rtLiveBuf.keys()]) {
    const r = Number(key.split(":")[0]);
    if (!busy || (active !== null && r < active) || (active === null && r > 0)) rtLiveBuf.delete(key);
  }
  if (!busy) rtLiveBuf.clear();

  for (const [key, buf] of rtLiveBuf) {
    const box = container.querySelector(`.rtLive[data-live="${key}"]`);
    if (box) {
      box.hidden = false;
      box.innerHTML = `<div class="who">生成中…</div><div class="txt md">${mdToHtml(buf)}</div>`;
    }
  }
  if (busy && active !== null) {
    for (const m of roomMembers(room)) {
      const done = last.turns.some((t) => t.kind !== "host" && t.round === active && t.sessionId === m.sessionId);
      setColStatus(active, m.sessionId, done ? "已完成" : "等待中…");
    }
  }
  bindRoomPromptToggles();
}

/* =====================================================================
   工作队（crew）视图：任务板 + worker 分栏 + 合并
   ===================================================================== */
const CREW_COL = [
  ["todo", "待办", (t) => t.status === "pending" || t.status === "blocked"],
  ["working", "进行中", (t) => t.status === "working"],
  ["review", "待评审", (t) => t.status === "review"],
  ["done", "完成 / 失败", (t) => t.status === "done" || t.status === "failed"],
];
const crewLabel = (id) => sessions.get(id)?.harnessLabel ?? id;

function crewDetailHtml(room) {
  const c = room.crew;
  const phaseTxt = { working: room.status === "running" ? "进行中" : "未开始", "ready-merge": "待合并", merged: "已合并", conflict: "合并冲突" }[c.phase] || c.phase;

  return `
    <div class="rtWrap">
      <div class="rtHead">
        <button class="mini" id="rtBack">← 圆桌列表</button>
        <span class="ttl">${esc(room.topic)}</span>
        <span class="pill ${room.status === "done" ? "done" : room.status === "running" ? "running" : room.status === "error" ? "error" : "saved"}">${ROOM_STATUS[room.status] || room.status}</span>
        <span class="meta2">${phaseTxt}</span>
        ${c.phase === "ready-merge" ? '<button class="primary mini" id="crewMerge">合并到主目录</button>' : ""}
        <button class="mini" id="crewDecBtn" title="自动权限决策记录（含工具入参、理由、⚠ 危险标记）">🧾 决策</button>
        <button class="mini" id="crewDelBtn" title="每个任务的交付件：产物（可下载）/提交/评审/diff">📦 交付</button>
        ${room.status === "running" ? '<button class="mini" id="rtStop">停止</button>' : ""}
      </div>
      <div class="meta2" style="margin:6px 0 12px">
        #${room.id} · ${esc(room.cwd || "—")} · 工头：${esc(room.host?.harnessLabel || "—")}
        · 成员：${(c.workers || []).map((w) => esc(w.harnessLabel)).join("、")}
        · 打回上限 ${c.maxAttempts} 次 · ${c.mergeMode === "auto" ? "自动合并" : "人工确认合并"}
        ${room.error ? ` · <span style="color:var(--err)">${esc(room.error)}</span>` : ""}
      </div>

      ${c.tasks.length ? `
      <div class="crewBoard">
        ${CREW_COL.map(([key, label, pred]) => {
          const list = c.tasks.filter(pred);
          return `<div class="crewCol"><div class="hd">${label} <span class="cnt">${list.length}</span></div>
            ${list.map((t) => crewTaskCard(t)).join("") || '<div class="meta2">—</div>'}
          </div>`;
        }).join("")}
      </div>` : `<div class="rtCard"><div class="meta2">工头正在拆解任务…</div></div>`}

      ${(c.tasks || []).some((t) => t.review) ? `
      <div class="rtCard"><h3>评审记录</h3>
        ${c.tasks.filter((t) => t.review).map((t) => `
          <div class="wsRow" style="padding:6px 0">
            <span class="badge ${t.review.verdict === "approve" ? "" : "host"}">${t.review.verdict === "approve" ? "通过" : "打回"}${t.review.score != null ? ` ${t.review.score}/10` : ""}</span>
            <b>${esc(t.id)}</b> ${esc(t.title)}
            <span class="meta2">${esc(t.review.reviewer)}：${esc(t.review.comments).slice(0, 120)}</span>
          </div>`).join("")}
      </div>` : ""}

      ${c.mergeLines?.length || c.phase === "ready-merge" ? `
      <div class="rtCard"><h3>合并</h3>
        ${(c.mergeLines || []).map((l) => /暂停|冲突|失败/.test(l)
          ? `<div style="color:var(--warn);font-weight:600;margin:4px 0">⚠ ${esc(l)}</div>`
          : `<div class="meta2">${esc(l)}</div>`).join("") || '<div class="meta2">任务完成后点顶部「合并到主目录」</div>'}
        ${(c.conflicts || []).length ? c.conflicts.map((x) => `<div style="color:var(--err);font-size:12px;margin-top:6px">${esc(x.branch)} 冲突：<pre style="white-space:pre-wrap;font-size:11px">${esc(x.output)}</pre></div>`).join("") : ""}
      </div>` : ""}

function setCrewStatus(sessionId, text) {
  document.querySelectorAll(`.st[data-cst="${sessionId}"]`).forEach((el) => (el.textContent = text));
}

/* ---------- 活性标签：● 已 X 分钟 · 活动 Y 前（数据 = 服务端 SessionInfo 的 turnStartedAt/lastProgressAt + 本地事件时间戳） ---------- */
const lastEventAt = new Map();   // sessionId → 本端最近收到 update 事件的时刻（比服务端广播更细）
function noteSessionEvent(sessionId) { if (sessionId) lastEventAt.set(sessionId, Date.now()); }

function fmtAgo(ms) {
  if (ms < 5000) return "刚刚";
  if (ms < 60_000) return Math.floor(ms / 1000) + " 秒前";
  if (ms < 3_600_000) return Math.floor(ms / 60_000) + " 分钟前";
  return Math.floor(ms / 3_600_000) + " 小时前";
}
function fmtDur(ms) {
  const m = Math.floor(ms / 60_000);
  if (m < 60) return m + " 分钟";
  return Math.floor(m / 60) + " 小时" + (m % 60) + "分";
}

function liveTagText(sid) {
  const s = sessions.get(sid);
  if (!s) return { text: "", cls: "liveTag" };
  if (!s.live) {
    // worker 会话被房间收尾停掉（已存档）→ 明确显示完成，而不是让用户猜
    const room = state.roomId ? roomById(state.roomId) : null;
    if (room?.crew && room.crew.phase !== "working" && (room.crew.workers || []).some((w) => w.sessionId === sid)) {
      return { text: "✓ 已完成", cls: "liveTag ok" };
    }
    return { text: "未运行", cls: "liveTag" };
  }
  if (!s.inTurn) return { text: "空闲", cls: "liveTag idle" };
  const evAt = lastEventAt.get(sid) ?? s.lastProgressAt ?? Date.now();
  const silence = Math.max(0, Date.now() - evAt);
  const dur = Date.now() - (s.turnStartedAt ?? Date.now());
  const cls = silence > 120_000 ? "liveTag warn" : "liveTag ok";
  return { text: `● 已 ${fmtDur(dur)} · 活动 ${fmtAgo(silence)}`, cls };
}

function tickLiveTags() {
  document.querySelectorAll("[data-live-st]").forEach((el) => {
    const r = liveTagText(el.dataset.liveSt);
    el.textContent = r.text;
    el.className = r.cls;
  });
  document.querySelectorAll("[data-task-st]").forEach((el) => {
    const r = liveTagText(el.dataset.taskWorker);
    el.textContent = r.text ? r.text.replace("● ", "") : "";
  });
}
setInterval(tickLiveTags, 5_000);

function syncCrewBlocks(room) {
  const c = room.crew;
  if (!c) return;
  const root = $("viewRoot");
  const keep = new Map();
  root.querySelectorAll(".rtLive[data-live]").forEach((b) => { if (!b.hidden) keep.set(b.dataset.live, b.innerHTML); });
  root.innerHTML = roomDetailHtml(room);
  root.dataset.roomId = room.id;
  bindRoomDetail(room);
  for (const [sid, html] of keep) {
    const box = root.querySelector(`.rtLive[data-live="${sid}"]`);
    if (box) { box.hidden = false; box.innerHTML = html; }
  }
  if (room.status !== "running") for (const sid of keep.keys()) setCrewStatus(sid, "");
  updateRoomHead(room);   // 停止/出错时让「继续运行」按钮出现
}

function askRoomDelete(roomId) {
  const room = roomById(roomId);
  const n = (room?.members?.length ?? 0) + (room?.host ? 1 : 0);
  const existing = document.getElementById("rtDelMask");
  if (existing) existing.remove();
  const mask = document.createElement("div");
  mask.id = "rtDelMask";
  mask.className = "mask";
  mask.innerHTML = `
    <div class="dialog">

function bindRoomDetail(room) {
  $("rtBack").onclick = () => { state.roomId = null; delete $("viewRoot").dataset.roomId; renderRoundtable(); };
  if ($("rtStop")) $("rtStop").onclick = () => send({ type: "room-stop", roomId: room.id });
  if ($("crewMerge")) {
    $("crewMerge").onclick = () => {
      $("crewMerge").disabled = true;
      $("crewMerge").textContent = "合并中…";
      showToast("正在合并 worker 分支到主目录…", 4000);
      send({ type: "crew-merge", roomId: room.id });
    };
  }
  if ($("crewDecBtn")) $("crewDecBtn").onclick = () => openCrewPanel(room.id, "decisions");
  if ($("crewDelBtn")) $("crewDelBtn").onclick = () => openCrewPanel(room.id, "deliverables");
  $("rtAsk")?.addEventListener("click", () => {
    const topic = $("rtTopic2").value.trim();
    if (!topic) { alert("先写议题"); return; }
    send({
      type: "room-topic",
      roomId: room.id,
      topic,
      rounds: Number($("rtRounds2").value),
      mode: $("rtMode2")?.value || "parallel",
      converge: $("rtConverge2").checked,
      tournament: $("rtTournament2").checked,
      writeAllowed: $("rtWrite2").checked,
    });
  });

  const seg = $("rtModeSeg");
  if (seg) {
    seg.querySelectorAll("button").forEach((b) => {
      b.onclick = () => {
        send({ type: "room-mode", roomId: room.id, mode: b.dataset.m });
        seg.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
      };
    });
  }
  bindRoomPromptToggles();
}

function bindRoomPromptToggles() {
  document.querySelectorAll("button[data-prompt]").forEach((b) => {
    b.onclick = (e) => {
      e.stopPropagation();
      const ts = b.dataset.prompt;
      const pre = document.querySelector(`pre[data-promptFor="${ts}"]`);
      if (pre) pre.hidden = !pre.hidden;
    };
  });
}

    });
    $("syncGo").disabled = true;
    $("syncGo").textContent = "扫描中…";
  };
};

function renderSyncResult(sums) {
  const mask = $("syncMask");
  if (!mask) return;
  const dlg = mask.querySelector(".dialog");
  if (!dlg) return;
  let html = `<h3 style="margin:0 0 10px;font-size:15px">同步完成</h3>`;
  for (const s of sums) {
    html += `<div class="wsRow"><b>${esc(s.label)}</b>: 发现 ${s.found}，导入 ${s.imported}，更新 ${s.updated}，跳过 ${s.skipped}</div>`;
  }
  html += `<div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="primary" onclick="document.getElementById('syncMask').remove()">确定</button></div>`;
  dlg.innerHTML = html;
}
</script>
</body>
</html>
