<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#12151c" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<script>
(function() {
  try {
    var pref = localStorage.getItem("hg_view_mode");
    var ua = navigator.userAgent || navigator.vendor || window.opera || "";
    var isMobUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|Silk|HarmonyOS|XiaoMi|MiuiBrowser|MicroMessenger/i.test(ua);
    var isTouch = (navigator.maxTouchPoints > 0 || ("ontouchstart" in window)) && window.innerWidth <= 1024;
    var isNarrow = window.innerWidth <= 860;
    var isMob = pref === "mobile" || (pref !== "desktop" && (isMobUA || isTouch || isNarrow));
    if (isMob) document.documentElement.classList.add("is-mobile");
  } catch(e) {}
  /* PWA：仅 https 安全上下文注册 Service Worker（http 局域网自动跳过） */
  try {
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      navigator.serviceWorker.register("/sw.js").catch(function() {});
    }
  } catch(e) {}
})();
</script>
<title>HarnessGate</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<style>
  :root {
    color-scheme: dark;
    --bg:#0b0d12; --panel:#12151c; --panel2:#171b24; --line:#232833; --line2:#2e3542;
    --fg:#e8ebf1; --dim:#8b93a5; --dim2:#6b7383;
    --accent:#5b9cf8; --accent-dim:#2a4a7a;
    --ok:#3fb950; --warn:#d29922; --err:#f85149; --purple:#a371f7;
    --radius:10px;
    --header-h:49px;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  /* hidden 属性必须赢过内联 display:flex——JS 靠它开关控件，否则切到工作队时
     带内联样式的「允许改文件」藏不掉（UA 样式会被内联样式覆盖） */
  [hidden] { display:none !important; }
  html,body { height:100%; height:100dvh; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.6 ui-sans-serif,system-ui,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; overflow:hidden; }
  button,input,select,textarea { font:inherit; color:var(--fg); background:#0d1016; border:1px solid var(--line2); border-radius:8px; padding:6px 10px; }
  button { cursor:pointer; background:#1a1f2a; transition:border-color .15s, background .15s; white-space:nowrap; }
  button:hover { border-color:var(--accent); background:#1f2634; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.primary { background:var(--accent); color:#06101f; border-color:var(--accent); font-weight:600; }
  button.primary:hover { background:#79b0ff; }
  button.ghost { background:transparent; border-color:transparent; color:var(--dim); }
  button.ghost:hover { color:var(--fg); background:#1a1f2a; border-color:var(--line2); }
  button.mini { padding:2px 8px; font-size:12px; border-radius:6px; }
  a { color:var(--accent); }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:#242a36; border-radius:4px; border:2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background:#333b4a; }

  /* ---------- 顶栏 ---------- */
  header { display:flex; align-items:center; gap:10px; padding:9px 14px; background:var(--panel);
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20; flex-wrap:wrap; min-height:var(--header-h); }
  .brand { font-weight:700; letter-spacing:.2px; font-size:15px; display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .brand span { color:var(--accent); }
  .menu-btn { display:none; }
  .crumbs { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--dim); min-width:0; }
  .crumbs b { color:var(--fg); font-weight:600; }
  .crumbs .sep { color:var(--dim2); }
  .crumbs a { color:var(--dim); text-decoration:none; cursor:pointer; }
  .crumbs a:hover { color:var(--accent); }
  .pill { font-size:11px; border:1px solid var(--line2); border-radius:999px; padding:1px 8px; color:var(--dim); white-space:nowrap; }
  .pill.ready,.pill.done { color:var(--ok); border-color:#1f4a28; background:#0f1a12; }
  .pill.starting,.pill.running,.pill.awaiting { color:var(--warn); border-color:#4a3c17; background:#171304; }
  .pill.error { color:var(--err); border-color:#4a1f22; background:#190d0e; }
  .pill.saved { color:var(--dim); }
  .pill.idle { color:var(--accent); border-color:#1f3350; background:#111826; }
  .spacer { flex:1; }
  .cfgw { display:inline-flex; align-items:center; gap:5px; }
  .cfgl { font-size:11.5px; color:var(--dim2); white-space:nowrap; }
  select.sm { padding:4px 8px; font-size:12.5px; max-width:230px; }

  /* ---------- 布局 ---------- */
  main { display:grid; grid-template-columns:300px 1fr; flex:1; min-height:0; }
  aside#side { border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  .sideHead { padding:10px; border-bottom:1px solid var(--line); display:flex; gap:6px; align-items:center; }
  .sideHead input { flex:1; padding:5px 8px; font-size:13px; }
  #tree { flex:1; overflow:auto; padding:6px; -webkit-overflow-scrolling:touch; }
  .hNode { margin-bottom:2px; }
  .hRow { display:flex; align-items:center; gap:7px; padding:6px 8px; border-radius:8px; cursor:pointer; }
  .hRow:hover { background:#1a1f2a; }
  .hRow.active { background:#1c2534; }
  .hRow .dot { width:7px; height:7px; border-radius:50%; background:var(--dim2); flex:none; }
  .hRow .dot.on { background:var(--ok); box-shadow:0 0 6px #3fb95066; }
  .hRow .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13.5px; }
  .hRow .ct { font-size:11px; color:var(--dim2); }
  .caret { width:12px; color:var(--dim2); font-size:10px; flex:none; }
  .sList { margin:0 0 6px 14px; padding-left:8px; border-left:1px solid var(--line); }
  .sRow { display:flex; gap:6px; align-items:center; padding:5px 7px; border-radius:7px; cursor:pointer; font-size:12.5px; }
  .sRow:hover { background:#1a1f2a; }
  .sRow.active { background:#1c2534; }
  .sRow .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--dim); }
  .sRow.active .t { color:var(--fg); }

  section#main { display:flex; flex-direction:column; min-width:0; min-height:0; }
  .view { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; }
  .pad { padding:18px 22px; }

  /* ---------- 卡片（harness 总览） ---------- */
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:12px; }
  .card { background:var(--panel2); border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px; cursor:pointer;
    transition:border-color .15s, transform .1s, box-shadow .15s; display:flex; flex-direction:column; gap:8px; }
  .card:hover { border-color:var(--accent-dim); transform:translateY(-1px); box-shadow:0 6px 18px #0006; }
  .card.off { opacity:.52; }
  .card.off:hover { border-color:var(--line2); }
  .card .top { display:flex; align-items:center; gap:8px; }
  .card .nm { font-weight:600; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .ver { font-size:11px; color:var(--dim2); }
  .card .desc { font-size:12.5px; color:var(--dim); min-height:34px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .meta { display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:11.5px; color:var(--dim2); }
  .badge { font-size:11px; border:1px solid var(--line2); border-radius:999px; padding:0 7px; color:var(--dim); }
  .badge.reg { color:var(--purple); border-color:#3a2a5c; background:#171029; }
  .badge.warn { color:var(--warn); border-color:#4a3c17; }

  /* ---------- 会话列表 ---------- */
  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:14px 22px 0; }
  .toolbar .ttl { font-size:17px; font-weight:600; margin-right:6px; }
  .newbox { display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:var(--panel2); border:1px solid var(--line);
    border-radius:var(--radius); padding:10px 12px; margin:14px 22px 0; }
  .newbox input[type=text] { min-width:260px; }

  /* ---------- 工作目录补全 ---------- */
  .acwrap { position:relative; flex:1; display:flex; min-width:260px; }
  .acwrap input { width:100%; }
  .aclist { position:absolute; top:calc(100% + 5px); left:0; right:0; z-index:60; padding:4px;
    background:var(--panel); border:1px solid var(--line2); border-radius:var(--radius);
    box-shadow:0 14px 34px rgba(0,0,0,.5); max-height:280px; overflow:auto; }
  .aclist .it { display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:7px;
    font-size:12.5px; cursor:pointer; }
  .aclist .it:hover, .aclist .it.on { background:#1f2634; }
  .aclist .it .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .aclist .it .nm b { color:var(--accent); font-weight:600; }
  .aclist .ft { display:flex; gap:8px; align-items:center; padding:6px 8px 4px; margin-top:4px;
    border-top:1px solid var(--line); font-size:11px; color:var(--dim2); }
  .aclist .ft .p { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .aclist .ft.create { color:var(--warn); }
  .aclist .ft.bad { color:var(--err); }
  .rows { padding:12px 22px 30px; display:flex; flex-direction:column; gap:7px; }
  .row { display:flex; align-items:center; gap:10px; background:var(--panel2); border:1px solid var(--line); border-radius:var(--radius); padding:10px 13px; }
  .row:hover { border-color:var(--line2); }
  .row .main { flex:1; min-width:0; }
  .row .t1 { font-size:13.8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .t2 { font-size:11.5px; color:var(--dim2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .acts { display:flex; gap:5px; flex-wrap:wrap; }
  .empty { color:var(--dim2); text-align:center; padding:60px 20px; }
  .empty .big { font-size:34px; opacity:.5; margin-bottom:10px; }

  /* ---------- 圆桌（独立视图） ---------- */
  .rtWrap { padding:18px 22px 40px; max-width:1100px; }
  .rtHead { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:4px; }
  .rtHead .ttl { font-size:19px; font-weight:600; }
  .steps { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:14px 0 18px; }
  .step { display:flex; align-items:center; gap:7px; padding:6px 12px; border-radius:999px;
    border:1px solid var(--line2); background:var(--panel2); font-size:12.5px; color:var(--dim); }
  .step .n { width:18px; height:18px; border-radius:50%; background:var(--line2); color:var(--fg);
    display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; }
  .step.on { border-color:var(--accent); color:var(--fg); }
  .step.on .n { background:var(--accent); color:#06101f; }
  .step.done { color:var(--ok); border-color:#1f4a28; }
  .step.done .n { background:var(--ok); color:#06101f; }
  .rtCard { background:var(--panel2); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; margin-bottom:14px; }
  .rtCard > h3 { font-size:13px; color:var(--dim); margin:0 0 10px; font-weight:600; }
  /* 向导/圆桌表单里的下拉：小屏不让它撑破容器（选项文字较长） */
  .rtCard label { max-width:100%; }
  .rtCard select { max-width:100%; }
  .pickGrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(212px,1fr)); gap:9px; }
  .pick { display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:99px;
    border:1px solid var(--line2); background:var(--panel); cursor:pointer; }
  .pick:hover { border-color:var(--accent); }
  .pick.sel { border-color:var(--accent); background:#141d2e; }
  .pick.off { opacity:.42; cursor:not-allowed; }
  .pick .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; }
  .pick .st { font-size:10.5px; color:var(--dim2); }
  /* 第 2 步：每个成员的配置（模型等） */
  .memberCfg { margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
  .memberCfg .row { display:flex; align-items:center; gap:9px; flex-wrap:wrap; padding:7px 0;
    border-bottom:1px solid var(--line); }
  .memberCfg .row:last-child { border-bottom:0; }
  .memberCfg .nm { font-size:13px; font-weight:600; min-width:110px; }
  .memberCfg label { font-size:11.5px; color:var(--dim2); display:flex; align-items:center; gap:5px; }
  .memberCfg select { width:auto; max-width:min(320px,42vw); font-size:12px; padding:3px 8px; }
  .rtTopic { width:100%; min-height:74px; }
  .rtLog { display:flex; flex-direction:column; gap:12px; }
  .rtTurn { border-left:2px solid var(--line2); padding:2px 0 2px 13px; }
  .rtScore { display:inline-block; font-size:11px; color:var(--warn); border:1px solid #4a3a1f; border-radius:6px;
    padding:0 7px; margin:0 0 5px; background:#1d1810; }
  .rtTurn .who { font-size:12px; color:var(--dim2); margin-bottom:5px; }
  .rtTurn .who b { color:var(--accent); font-weight:600; }
  .rtTurn .txt { font-size:13.5px; line-height:1.62; }
  .rtTurn .txt > :first-child { margin-top:0; }
  .rtTurn .txt > :last-child { margin-bottom:0; }
  .rtTurn.pending { border-left-color:var(--warn); }
  .rtTurn.pending .txt { color:var(--dim2); font-style:italic; }
  .rtBadge { font-size:11px; color:var(--dim2); margin-left:6px; }

  /* 按轮次纵向排列：轮内分栏 */
  .rtRound { margin-bottom:16px; }
  .rtRound.pending { opacity:.45; }
  .rtRound.active .rtRoundHead { border-color:var(--accent); }
  .rtRoundHead { display:flex; align-items:center; gap:9px; padding:7px 0 9px;
    border-bottom:1px solid var(--line); margin-bottom:10px; }
  .rtRoundHead .rn { font-size:13.5px; font-weight:600; }
  .rtRoundHead .rn.host { color:var(--purple); }
  .rtCols { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(268px,1fr); gap:11px;
    overflow-x:auto; padding-bottom:6px; align-items:start; -webkit-overflow-scrolling:touch; }
  .rtCol { background:var(--panel2); border:1px solid var(--line); border-radius:var(--radius);
    min-width:0; display:flex; flex-direction:column; max-height:56vh; }
  .rtColHead { display:flex; align-items:center; gap:7px; padding:8px 12px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--panel2); border-radius:var(--radius) var(--radius) 0 0; z-index:1; }
  .rtColHead .nm { font-size:12.5px; font-weight:600; flex:1; min-width:0; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .rtColHead .st { font-size:10.5px; color:var(--warn); white-space:nowrap; }
  .rtColBody { padding:10px 12px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; -webkit-overflow-scrolling:touch; }
  .rtColBody .rtTurn .txt { font-size:13px; }
  .rtColBody .rtTurn .txt > :first-child { margin-top:0; }
  .rtColBody .rtTurn .txt > :last-child { margin-bottom:0; }
  .rtLive { border-left:2px solid var(--accent); padding-left:10px; }
  .rtLive .who { font-size:11.5px; color:var(--accent); margin-bottom:4px; }
  .rtLive .txt { font-size:13px; }
  .rtLive .txt > :first-child { margin-top:0; }
  /* 主持人区块：横跨整行 */
  .rtHostBlock { background:var(--panel2); border:1px solid #3a2a55; border-left:3px solid var(--purple);
    border-radius:var(--radius); padding:11px 15px; margin-bottom:16px; }
  .rtHostBlock.liveHost { border-left-color:var(--accent); }
  .rtHostBlock .rtRoundHead { border-bottom-color:#3a2a55; }
  .rtHostBody .txt { font-size:13.5px; line-height:1.62; }
  .rtHostBody .txt > :first-child { margin-top:0; }
  .rtHostBody .txt > :last-child { margin-bottom:0; }
  .badge.host { color:var(--purple); border-color:#3a2a55; background:#17111f; }
  /* 分段控件 */
  .seg { display:inline-flex; border:1px solid var(--line2); border-radius:8px; overflow:hidden; }
  .seg button { border:0; border-radius:0; background:transparent; padding:4px 11px; font-size:12px; color:var(--dim); }
  .seg button + button { border-left:1px solid var(--line2); }
  .seg button.on { background:var(--accent); color:#06101f; font-weight:600; }
  .rtPastTopic { padding:7px 0; border-bottom:1px solid var(--line); }
  .rtPastTopic details { margin-top:5px; }
  .rtPastTopic summary { cursor:pointer; font-size:11.5px; color:var(--dim2); }
  /* 工作队（crew）：任务板 */
  .crewBoard { display:grid; grid-template-columns:repeat(4,minmax(200px,1fr)); gap:10px; margin-bottom:16px; }
  .crewCol { background:var(--panel2); border:1px solid var(--line); border-radius:var(--radius); padding:9px 10px; min-width:0; }
  .crewCol > .hd { font-size:12.5px; font-weight:600; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .crewCol .cnt { color:var(--dim2); font-weight:400; }
  .crewTask { background:var(--panel); border:1px solid var(--line2); border-radius:8px; padding:8px 10px; margin-bottom:8px; font-size:12.5px; }
  .crewTask .t1 { font-weight:600; margin-bottom:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .crewTask .t1 .tid { color:var(--accent); }
  .crewTask .t2 { font-size:11px; color:var(--dim2); margin-bottom:4px; }
  .crewTask .files { font-size:11px; color:var(--dim); font-family:var(--vscode-editor-font-family, monospace);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .crewTask details { margin-top:5px; }
  .crewTask summary { cursor:pointer; font-size:11px; color:var(--dim2); }
  .crewTask .review-ok { color:var(--ok); } .crewTask .review-bad { color:var(--warn); }
  .crewTask.failed { border-color:#4a1f22; }
  .crewWorkerCols { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(268px,1fr); gap:11px;
    overflow-x:auto; align-items:start; margin-bottom:16px; }
  /* 活性标签：● 已 X 分钟 · 活动 Y 前（绿=活跃脉冲，黄=静默超 2 分钟，红留给看门狗判死后） */
  .liveTag { font-size:11px; color:var(--dim2); padding:1px 0 6px; min-height:18px; }
  .liveTag.ok { color:var(--ok); }
  .liveTag.ok::first-letter { animation: pulse 1.6s infinite; }
  .liveTag.warn { color:var(--warn); }
  .liveTag.idle { color:var(--dim2); }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
  .crewBar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:11px 14px; }
  /* 对话框 */
  .mask { position:fixed; inset:0; background:rgba(0,0,0,.65); backdrop-filter:blur(2px); z-index:100; display:flex;
    align-items:center; justify-content:center; padding:16px; }
  .dialog { background:var(--panel); border:1px solid var(--line2); border-radius:var(--radius);
    padding:18px 20px; width:min(430px,94vw); box-shadow:0 20px 50px rgba(0,0,0,.6); }

  /* ---------- 对话与消息 ---------- */
  #chatWrap { display:flex; flex-direction:column; height:100%; min-height:0; position:relative; }
  .chatHead { padding:10px 22px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:12.5px; color:var(--dim); }
  /* 发言索引 + 搜索：贴在 chatHead 下面的一条导航栏 */
  .chatNav { display:flex; gap:6px; align-items:center; padding:6px 22px; border-bottom:1px solid var(--line); position:relative; flex-wrap:wrap; }
  .searchWrap { position:relative; flex:1; min-width:110px; max-width:320px; display:flex; }
  .searchWrap input { width:100%; padding:3px 9px; padding-right:26px; font-size:12px; }
  .searchClear { position:absolute; right:5px; top:50%; transform:translateY(-50%); width:18px; height:18px;
    border:none; background:var(--panel2); color:var(--dim); border-radius:50%; font-size:11px; line-height:1;
    display:flex; align-items:center; justify-content:center; padding:0; cursor:pointer; }
  .searchClear:hover { color:var(--fg); background:var(--line2); }
  .chatNav .cnt { font-size:11.5px; color:var(--dim2); flex:none; min-width:34px; text-align:center; }
  /* 看历史时浮现的「回到底部」箭头 */

  .gateHint code { background:var(--panel2); border:1px solid var(--line); padding:1px 6px; border-radius:4px; font-size:10.5px; }
  html.is-mobile .gateCard { padding:28px 20px 20px; }

</style>
</head>
<body>

<div id="crewPanel" class="drawer" hidden></div>

<script>
/* =====================================================================
   状态与数据源
   ===================================================================== */
const state = {
  view: "harnesses",      // "harnesses" | "sessions" | "chat" | "roundtable"
  harnessId: null,
  sessionId: null,
  roomId: null,
  filter: "",
  rtStep: 1,
  rtCwd: "",
  rtKind: "crew",         // "crew" 工作队（默认） | "discuss" 圆桌讨论 —— 第一步选目录时就确定
  rtPicked: new Set(),
  rtMemberCfg: {},        // { [harnessId]: { [configId]: value } }
  rtMemberVars: {},       // { [harnessId]: { [变量名]: 值 } }（如 openclaw 的 HG_OPENCLAW_AGENT）
  rtHost: "",
  rtHostCfg: {},          // { [configId]: value } 主持人/工头自己的模型与参数
  rtHostOpening: true,
  rtHostRound: true,
  rtHostFinal: true,
  rtHostStyle: "divergent",
};

let ws = null;
let harnesses = new Map();
let sessions = new Map();
let rooms = [];
let schedulesArr = [];   // 定时任务
let schedEdit = null;    // 正在编辑的定时任务（null = 列表态）
let pendingFiles = [];
let entries = [];
let nodes = [];
let streamingAssistant = false;
let transcriptBase = 0;
let showLog = false;
let pendingRoomStart = false;
let pendingCreate = false;   // 新建会话后等服务端回包，自动进入对话
const collapsedHarnesses = new Set();

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);

/* ---------- PWA 安装入口：Android 用 beforeinstallprompt，iOS 给图文步骤 ---------- */
let installEvt = null;
const isStandalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const pwaBtn = () => document.getElementById("pwaInstall");
if (!isStandalone) {
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; const b = pwaBtn(); if (b) b.style.display = ""; });
  if (isIOS) { const b = pwaBtn(); if (b) b.style.display = ""; b && (b.title = "iOS：用 Safari 分享菜单添加到主屏幕"); }
}
function pwaInstallClick() {
  if (installEvt) {
    installEvt.prompt();
    installEvt.userChoice?.outcome === "accepted" && pwaBtn() && (pwaBtn().style.display = "none");
    installEvt = null;
    return;
  }
  if (isIOS) showToast("iOS 安装：点 Safari 底部分享按钮 □↑ → 选「添加到主屏幕」", 8000);
  else showToast("当前浏览器不支持一键安装：用菜单里的「添加到主屏幕/安装应用」，或换 Chrome 试试", 6000);
}

/* =====================================================================
   WebSocket
   ===================================================================== */
function tokenOf() {
  /* 2026-09-19 服务端开启认证：URL ?token= 优先，存 localStorage 供后续免参访问 */
  try {
    const qp = new URLSearchParams(location.search).get("token");
    if (qp) { localStorage.setItem("hg_token", qp); return qp; }
    return localStorage.getItem("hg_token") || "";
  } catch { return ""; }
}
window.__hgToken = tokenOf();   // 下载链接等 <a href> 用（不能走 WS 认证）
/* ?token= 存入 localStorage 后立即从地址栏抹掉（不留历史/不被分享误带）；保留 hash 路由 */
if (new URLSearchParams(location.search).get("token")) {
  try { history.replaceState(null, "", location.pathname + location.hash); } catch {}
}

/* ---------- 认证门 ---------- */
let gateOn = false, gateSubmitted = false;
function showGate(tried) {
  if (!gateOn) {
    gateOn = true;
    $("gate").style.display = "flex";
    $("gateInput").value = localStorage.getItem("hg_token") || "";
    setTimeout(() => $("gateInput").focus(), 60);
  }
  if (tried) {
    const inp = $("gateInput");
    inp.classList.remove("bad"); void inp.offsetWidth; inp.classList.add("bad");   // 重触发抖动
    $("gateErr").textContent = "token 不对，请检查后重试";
    $("gateErr").style.display = "block";
  }
  $("gateGo").disabled = false;
  $("gateGo").textContent = "进入";
}
function hideGate() {
  gateOn = false;
  $("gate").style.display = "none";
}
function submitGate() {
  const v = $("gateInput").value.trim();
  if (!v) { $("gateInput").focus(); return; }
  localStorage.setItem("hg_token", v);
  window.__hgToken = v;
  try { if (new URLSearchParams(location.search).get("token")) history.replaceState(null, "", location.pathname); } catch {}
  $("gateErr").style.display = "none";
  $("gateGo").disabled = true;
  $("gateGo").textContent = "验证中…";
  gateSubmitted = true;
  if (ws) { try { ws.onclose = null; ws.close(); } catch {} }   // 掐掉旧连接的重连逻辑，走提交后的显式重连
  connect();
}
$("gateGo").onclick = submitGate;
$("gateInput").addEventListener("keydown", (e) => { if (e.key === "Enter") submitGate(); });
$("gateEye").onclick = () => { const i = $("gateInput"); i.type = i.type === "password" ? "text" : "password"; };
/* 其他标签页改了 token → 这边自动重试 */
window.addEventListener("storage", (e) => { if (e.key === "hg_token" && gateOn) { gateSubmitted = true; connect(); } });

function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const tk = tokenOf();
  ws = new WebSocket(`${proto}//${location.host}/ws${tk ? `?token=${encodeURIComponent(tk)}` : ""}`);
  ws.onopen = () => {
    /* 注意：开了认证时，未授权连接也会先 open、随后才被服务端以 4401 关闭。
       真正的“验证通过”以收到 hello 为准（见 onmessage），这里不能关登录门。 */
    $("conn").textContent = "已连接";
    $("conn").className = "pill ready";
  };
  ws.onclose = (ev) => {
    if (ev && ev.code === 4401) {
      /* 认证失败：弹登录门（提交过的 token 又失败会标红），门开着就不盲连了 */
      $("conn").textContent = "认证失败";
      $("conn").className = "pill error";
      showGate(gateSubmitted);
      gateSubmitted = false;
      return;
    }
    $("conn").textContent = "已断开";
    $("conn").className = "pill error";
    setTimeout(connect, 1500);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === "hello" && gateOn) { gateSubmitted = false; hideGate(); }   // hello = 认证真正通过
      handleServer(msg);
    } catch (e) {
      console.error("ws 消息解析失败", e, ev.data);
    }
  };
}
function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(obj));
    return true;
  }
  return false;
}
connect();


/* =====================================================================
   设备识别与显示模式 (User-Agent & View Mode)
   ===================================================================== */
function isMobileUA() {
  const ua = navigator.userAgent || navigator.vendor || window.opera || "";
  return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|Silk|HarmonyOS|XiaoMi|MiuiBrowser|MicroMessenger|Mobile Safari|Mobile Chrome/i.test(ua);
}

function detectIsMobile() {
  const pref = localStorage.getItem("hg_view_mode"); // "mobile" | "desktop" | "auto"
  if (pref === "mobile") return true;
  if (pref === "desktop") return false;
  const mobUA = isMobileUA();
  const isTouch = (navigator.maxTouchPoints > 0 || ("ontouchstart" in window)) && window.innerWidth <= 1024;
  const isNarrow = window.innerWidth <= 860;
  return mobUA || isTouch || isNarrow;
}

let toastTimer = null;
function showToast(msg, ms = 2200) {
  const t = $("toast");
  if (!t) return;
  t.textContent = msg;
  t.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}

function applyDeviceMode() {
  const isMob = detectIsMobile();
  if (isMob) {
    document.documentElement.classList.add("is-mobile");
    document.body.classList.add("is-mobile");
  } else {
    document.documentElement.classList.remove("is-mobile");
    document.body.classList.remove("is-mobile");
  }
  const pref = localStorage.getItem("hg_view_mode") || "auto";
  const btn = $("devModeBtn");
  if (btn) {
    if (pref === "mobile") {
      btn.textContent = "📱 手机";
      btn.title = "当前：强制手机模式（点击切换为电脑版）";
    } else if (pref === "desktop") {
      btn.textContent = "💻 电脑";
      btn.title = "当前：强制电脑模式（点击切换为自动识别）";
    } else {
      btn.textContent = isMob ? "⚡ 手机" : "⚡ 电脑";
      btn.title = `当前：自动识别（${isMob ? "手机模式" : "电脑模式"}，点击切换）`;
    }
  }
}

function cycleDeviceMode() {
  const cur = localStorage.getItem("hg_view_mode") || "auto";
  let next = "auto";
  let tip = "";
  if (cur === "auto") {
    next = "mobile";
    tip = "📱 已强制切换为：手机版";
  } else if (cur === "mobile") {
    next = "desktop";
    tip = "💻 已强制切换为：电脑版";
  } else {
    next = "auto";
    const mob = isMobileUA() || window.innerWidth <= 860;
    tip = `⚡ 已恢复自动模式（识别为${mob ? "手机" : "电脑"}）`;
  }
  localStorage.setItem("hg_view_mode", next);
  applyDeviceMode();
  showToast(tip);
}

const devModeBtn = $("devModeBtn");
if (devModeBtn) devModeBtn.onclick = cycleDeviceMode;
window.addEventListener("resize", applyDeviceMode);
applyDeviceMode();

/* =====================================================================
   移动端抽屉控制
   ===================================================================== */
const sideEl = $("side");
const sideMask = $("sideMask");
const menuBtn = $("menuBtn");

function openSide() {
  if (sideEl) sideEl.classList.add("open");
  if (sideMask) sideMask.hidden = false;
}
function closeSide() {
  if (sideEl) sideEl.classList.remove("open");
  if (sideMask) sideMask.hidden = true;
}
if (menuBtn) {
  menuBtn.onclick = () => {
    if (sideEl && sideEl.classList.contains("open")) closeSide();
    else openSide();
  };
}
if (sideMask) {
  sideMask.onclick = closeSide;
}

/* ---------- 浏览器返回手势：视图层级压进 history 栈 ----------
   单页应用不接管 history 时，手机右滑返回找不到上一级就直接退出页面。
   正向导航 pushState 一份视图快照（URL 带 hash，刷新也能回到原视图）；
   popstate 按快照逐级恢复；总览是栈底，在总览再返回才真正离开。
   路由：#/h/<harnessId> 会话列表 · #/s/<sessionId> 对话 · #/r/<roomId> 圆桌 · #/rt 圆桌首页 · #/sched 定时 · #/ 总览；?d= 打开中的抽屉 */
const DRAWER_KEYS = { starPanel: "star", wsPanel: "ws", crewPanel: "crew", verPanel: "ver" };
function hashOfNav(n) {
  let h = "#/";
  if (n.view === "sessions" && n.harnessId) h = `#/h/${encodeURIComponent(n.harnessId)}`;
  else if (n.view === "chat" && n.sessionId) h = `#/s/${n.sessionId}`;
  else if (n.view === "roundtable") h = n.roomId ? `#/r/${n.roomId}` : "#/rt";
  else if (n.view === "schedules") h = "#/sched";
  if (n.drawer) h += `?d=${DRAWER_KEYS[n.drawer] || ""}`;
  return h;
}
function navOfHash(h) {
  if (!h?.startsWith("#/")) return null;
  const [path, query] = h.slice(2).split("?");
  const d = new URLSearchParams(query || "").get("d");
  const drawer = Object.keys(DRAWER_KEYS).find((k) => DRAWER_KEYS[k] === d);
  const seg = path.split("/").map((s) => { try { return decodeURIComponent(s); } catch { return s; } });
  if (seg[0] === "h" && seg[1]) return { view: "sessions", harnessId: seg[1], drawer };
  if (seg[0] === "s" && seg[1]) return { view: "chat", sessionId: seg[1], drawer };
  if (seg[0] === "r" && seg[1]) return { view: "roundtable", roomId: seg[1], drawer };
  if (seg[0] === "rt") return { view: "roundtable", drawer };
  if (seg[0] === "sched") return { view: "schedules", drawer };
  if (!seg[0]) return { view: "harnesses", drawer };   // "#/" 或 "#/?d=star"
  return null;
}
function pushNav(drawer) {
  const n = { view: state.view, harnessId: state.harnessId, sessionId: state.sessionId, roomId: state.roomId, drawer: drawer ?? null };
  try { history.pushState({ hgNav: n }, "", hashOfNav(n)); } catch { /* 极端环境降级为无栈 */ }
}
function collapseOverlays() {
  closeSide();
  for (const pid of ["crewPanel", "wsPanel", "starPanel", "verPanel"]) { const el = $(pid); if (el) el.hidden = true; }
  if (wsTimer) { clearInterval(wsTimer); wsTimer = null; }
}
function applyNav(n) {
  const target = n?.view || "harnesses";
  const sid = n?.sessionId ?? null;
  // 返回到对话视图且会话变了：transcript 已被别的视图占用，需全量重载
  const reloadChat = target === "chat" && sid && (state.view !== "chat" || state.sessionId !== sid);
  state.view = target;
  state.harnessId = n?.harnessId ?? null;
  state.sessionId = sid;
  state.roomId = n?.roomId ?? null;
  if (!state.roomId) state.rtStep = 1;
  collapseOverlays();
  if (n?.drawer === "starPanel") { $("starPanel").hidden = false; renderStarPanel(); }
  else if (n?.drawer === "verPanel") { $("verPanel").hidden = false; renderVerPanel(); }
  else if (n?.drawer === "crewPanel" && sessPanelSid) openSessPanel(sessPanelSid, sessPanelMode, false);
  else if (n?.drawer === "wsPanel") openWsPanel(false);
  if (reloadChat) { openSession(sid, false); return; }
  render();
}
window.addEventListener("popstate", (e) => applyNav(e.state?.hgNav || navOfHash(location.hash)));
/* 初始 hash 里带的视图（如刷新 #/s/<id>）：等 hello 数据到位再恢复 */
let navBoot = navOfHash(location.hash);
try { history.replaceState({ hgNav: navBoot || { view: "harnesses" } }, "", hashOfNav(navBoot || { view: "harnesses" })); } catch {}

/* =====================================================================
   服务端消息分发
   ===================================================================== */
function handleServer(msg) {
  switch (msg.type) {
    case "init":
    case "hello": /* 2026-09-19 服务端协议改名 init→hello */
      harnesses = new Map((msg.harnesses || []).map((h) => [h.id, h]));
      sessions = new Map((msg.sessions || []).map((s) => [s.id, s]));
      rooms = msg.rooms || [];
      schedulesArr = msg.schedules || [];
      serverVersion = msg.version || "";
      serverCommit = msg.commit || "";
      { const vb = $("verBtn"); if (vb) vb.textContent = serverVersion ? `v${serverVersion}` : "v?"; }
      $("viewRoot").dataset.cwd = msg.defaultCwd || "";   // 新会话目录的默认值来源
      render();
      if (navBoot) { const n = navBoot; navBoot = null; applyNav(n); }   // 刷新/分享链接带 #/s/<id> 等时恢复视图
      break;
    case "status":
    case "session": /* 2026-09-19 服务端协议改名 status→session */      if (msg.session) {
        const isNewSession = !sessions.has(msg.session.id);
        sessions.set(msg.session.id, msg.session);
        renderTree();
        refreshPills(msg.session.id);
        if (!$("starPanel").hidden) renderStarPanel();   // 收藏抽屉开着时实时刷新（新收藏/状态变化）
        if (isNewSession && pendingCreate) {
          pendingCreate = false;
          openSession(msg.session.id);   // 新建后自动进入对话（原行为）
          break;
        }
        if (state.view === "chat" && state.sessionId === msg.session.id) {
          updateChatHeader();
          renderModes();
          renderConfig();
        }
      }
      break;
    case "update":
      if (schedPick && schedPick.aiBusy && msg.sessionId === schedPick.sessionId) {
        const u0 = msg.update || {};
        if (u0.sessionUpdate === "agent_message_chunk" && u0.content?.text) {
          schedPick.text = (schedPick.text || "") + u0.content.text;
          const out = $("segOut");
          if (out) { out.textContent = schedPick.text; out.scrollTop = out.scrollHeight; }
        }
      }
      if (schedDistill && msg.sessionId === schedDistill.sessionId) {
        const u0 = msg.update || {};
        if (u0.sessionUpdate === "agent_message_chunk" && u0.content?.text) {
          schedDistill.text += u0.content.text;
          const out = $("distillOut");
          if (out) { out.textContent = schedDistill.text; out.scrollTop = out.scrollHeight; }
        }
      }
      if (state.view === "chat" && state.sessionId === msg.sessionId) {
        applyUpdate(msg.update);
      }
      if (state.view === "roundtable") {
        applyRoomUpdate(msg.sessionId, msg.update);
      }
      break;
    case "transcript":
      if (state.view === "chat" && state.sessionId === msg.sessionId) {
        entries = msg.entries || [];
        renderAll();
      }
      break;
    case "turn-end":
      if (state.view === "chat" && state.sessionId === msg.sessionId) {
        streamingAssistant = false;
      }
      break;
    case "permission":
      if (state.view === "chat" && state.sessionId === msg.sessionId) {
        pushEntry({
          kind: "permission",
          title: msg.title,
          requestId: msg.requestId,
          options: msg.options,
        });
      }
      break;
    case "log":
      if (state.view === "chat" && state.sessionId === msg.sessionId && showLog) {
        pushEntry({ kind: "log", text: msg.line });
      }
      break;
    case "workspace":
      renderWorkspace(msg.reports);
      break;
    case "schedules":
      schedulesArr = msg.schedules || [];
      if (state.view === "schedules" && !schedDistill && !schedEdit) renderSchedules();
      break;
    case "schedule-segmented": {
      // AI 精切结果替换本地段（AI 给的任务名更可读；schedulable=false 的已由服务端过滤）
      if (schedPick && schedPick.sessionId === msg.sessionId) {
        schedPick.segments = msg.segments || [];
        schedPick.aiBusy = false;
        if (schedPick.segments.length === 1) {
          const s2 = sessions.get(schedPick.sessionId);
          const only = schedPick.segments[0];
          schedPick = null;
          distillSegment(s2, only);
        } else renderSchedules();
      }
      break;
    }
    case "schedule-distilled": {
      // 蒸馏完成：用结果 + 本地兜底字段合成表单
      const src = sessions.get(msg.sessionId);
      const d = msg.spec || {};
      const seg = schedDistill?.seg;
      schedDistill = null;
      schedEdit = {
        name: (d.name || src?.title || "定时任务").slice(0, 24),
        enabled: true,
        harnessId: src?.harnessId || "",
        cwd: src?.cwd || "",
        autoApprove: "all",
        cadence: d.cadence && d.cadence.type ? d.cadence : { type: "daily", at: "09:00" },
        window: {}, overlap: "skip",
        sessionMode: "dedicated",
        promptTemplate: d.prompt || seg?.head || "",
        contract: d.outputFile ? { outputFile: d.outputFile } : {},
        state: { lastSessionId: msg.sessionId },
      };
      if (d.reason) showToast("频率建议：" + d.reason, 5000);
      if (state.view === "schedules") renderSchedules();
      break;
    }
    case "rooms":
      rooms = msg.rooms || [];
      if (pendingRoomStart && rooms.length) {
        const newest = rooms[rooms.length - 1];
        if (newest && newest.status === "running") {
          pendingRoomStart = false;
          state.view = "roundtable";
          state.roomId = newest.id;
          pushNav();
        }
      }
      if (state.view === "roundtable") renderRoundtable();
      break;
    case "room":
      {
        const idx = rooms.findIndex((r) => r.id === msg.room.id);
        if (idx >= 0) rooms[idx] = msg.room;
        else rooms.push(msg.room);
        if (pendingRoomStart && msg.room.id) {
          pendingRoomStart = false;
          state.view = "roundtable";
          state.roomId = msg.room.id;
          pushNav();
        }
        if (state.view === "roundtable" && state.roomId === msg.room.id) {
          renderRoundtable();
        }
        // 合并被阻塞/出结果时主动告知——别只写在页面底部的小字里（用户点了按钮却以为没反应）
        if (msg.room.crew && msg.room.crew.mergeLines?.length) {
          const key = msg.room.id + ":" + msg.room.crew.mergeLines.join("|");
          if (window.__mergeToastKey !== key) {
            window.__mergeToastKey = key;
            const blocked = msg.room.crew.mergeLines.some((l) => /暂停|冲突|失败/.test(l));
            showToast((blocked ? "⚠ " : "✓ ") + msg.room.crew.mergeLines[0], blocked ? 6000 : 4000);
          }
        }
      }
      break;
    case "crew-detail":
      if (msg.roomId === state.roomId || crewPanelRoomId === msg.roomId) {
        renderCrewPanel(msg.roomId, { decisions: msg.decisions || [], deliverables: msg.deliverables || [] });
      }
      break;
    case "error":
      /* 服务端的各类拒绝（圆桌前置校验、会话操作失败…）必须可见——吞掉就会表现为"点了没反应" */
      showToast("⚠ " + (msg.message || "操作失败"), 6000);
      console.warn("服务端错误:", msg.message, msg.sessionId || "");
      break;
    case "update-check":
      updateInfo = msg;
      renderVerPanel();
      { const vb = $("verBtn"); if (vb) vb.textContent = `v${msg.current || "?"}`; }
      break;
    case "update-applied":
      showToast(`✅ ${msg.message}`, 8000);
      { const vp = $("verPanel"); if (vp && !vp.hidden) vp.innerHTML = `<div class="hd"><b>版本与更新</b></div><div class="wsRow">✅ ${esc(msg.message)}</div>`; }
      break;
    case "session-detail":
      if (msg.sessionId) renderSessPanel(msg.sessionId, { decisions: msg.decisions || [], changes: msg.changes || [], git: msg.git });
      break;
    case "sync-result":
    case "history": /* 2026-09-19 服务端协议改名 sync-result→history */
      renderSyncResult(msg.summaries || []);
      break;
    case "deleted": /* 2026-09-19 新增：会话删除广播 */
      sessions.delete(msg.sessionId);
      if (state.sessionId === msg.sessionId) { state.view = "harnesses"; state.sessionId = null; }
      render();
      break;
    case "handoff_done": /* 2026-09-19 新增：接续完成后跳到新会话 */
      if (msg.to) openSession(msg.to);
      break;
    case "dirs":
      if (acList?.isConnected && msg.reqId === acList.dataset.req) { acData = msg; paintDirList(); }
      break;
  }
}

/* =====================================================================
   渲染调度
   ===================================================================== */
function render() {
  renderCrumbs();
  renderTree();
  if (state.view === "harnesses") renderHarnessGrid();
  else if (state.view === "sessions") renderSessionList();
  else if (state.view === "chat") renderChat();
  else if (state.view === "roundtable") renderRoundtable();
  else if (state.view === "schedules") renderSchedules();
}

function renderCrumbs() {
  const c = $("crumbs");
  const h = state.harnessId ? harnesses.get(state.harnessId) : null;
  const s = state.sessionId ? sessions.get(state.sessionId) : null;
  const room = state.roomId ? rooms.find((r) => r.id === state.roomId) : null;

  let html = `<a onclick="navHome()">总览</a>`;
  if (state.view === "roundtable") {
    html += `<span class="sep">/</span>`;
    if (room) {
      html += `<a onclick="navRoomList()">圆桌</a><span class="sep">/</span><b>${esc(room.topic.slice(0, 24))}</b>`;
    } else {
      html += `<b>新建圆桌</b>`;
    }
  } else if (h) {
    html += `<span class="sep">/</span><a onclick="navHarness('${h.id}')">${esc(h.label)}</a>`;
    if (s) {
      html += `<span class="sep">/</span><b>${esc(s.title || "#" + s.id)}</b>`;
    }
  }
  c.innerHTML = html;
}

function navHome() {
  state.view = "harnesses";
  state.harnessId = null;
  state.sessionId = null;
  state.roomId = null;
  closeSide();
  render();
  pushNav();
}
function navHarness(id) {
  state.view = "sessions";
  state.harnessId = id;
  state.sessionId = null;
  state.roomId = null;
  closeSide();
  render();
  pushNav();
}
function navRoomList() {
  state.view = "roundtable";
  state.roomId = null;
  state.rtStep = 1;
  closeSide();
  render();
  pushNav();
}

/* =====================================================================
   左侧树
   ===================================================================== */
$("filter").oninput = (e) => { state.filter = e.target.value.toLowerCase().trim(); renderTree(); };
$("collapseAll").onclick = () => {
  if (collapsedHarnesses.size === harnesses.size) collapsedHarnesses.clear();
  else for (const id of harnesses.keys()) collapsedHarnesses.add(id);
  renderTree();
};

function renderTree() {
  const tree = $("tree");
  const filter = state.filter;
  let html = "";

  for (const h of harnesses.values()) {
    const list = [...sessions.values()].filter((s) => s.harnessId === h.id);
    list.sort((a, b) => (b.starred ? 1 : 0) - (a.starred ? 1 : 0) || (b.lastActiveAt || "").localeCompare(a.lastActiveAt || ""));
    const liveCount = list.filter((s) => s.live).length;
    const matchH = !filter || h.label.toLowerCase().includes(filter) || h.id.includes(filter);
    const matchedSessions = list.filter((s) =>
      matchH || (s.title && s.title.toLowerCase().includes(filter)) || s.cwd.toLowerCase().includes(filter) || s.id.includes(filter)
    );
    if (filter && !matchH && !matchedSessions.length) continue;

    const collapsed = collapsedHarnesses.has(h.id) && !filter;
    const activeH = state.harnessId === h.id && state.view === "sessions";
    html += `
      <div class="hNode">
        <div class="hRow ${activeH ? "active" : ""}" data-hid="${h.id}">
          <span class="caret" data-toggle="${h.id}">${collapsed ? "▸" : "▾"}</span>
          <span class="dot ${liveCount ? "on" : ""}"></span>
          <span class="nm">${esc(h.label)}</span>
          <span class="ct">${list.length}</span>
        </div>
        ${!collapsed ? `
          <div class="sList">
            ${matchedSessions.map((s) => {
              const activeS = state.sessionId === s.id;
              return `
                <div class="sRow ${activeS ? "active" : ""}" data-sid="${s.id}">
                  <span style="display:inline-flex">${pillOf(s, STATUS_TAG)}</span>
                  ${s.starred ? '<span style="color:#f5b942" title="已收藏">★</span>' : ""}
                  <span class="t" title="${esc(s.cwd)}">${esc(s.title || s.cwd.split("/").pop() || "#" + s.id)}</span>
                </div>`;
            }).join("")}
          </div>` : ""}
      </div>`;
  }
  tree.innerHTML = html || '<div class="empty" style="padding:20px 0;font-size:12px">无匹配</div>';

  tree.querySelectorAll(".hRow").forEach((el) => {
    el.onclick = (e) => {
      if (e.target.dataset.toggle) {
        const id = e.target.dataset.toggle;
        if (collapsedHarnesses.has(id)) collapsedHarnesses.delete(id);
        else collapsedHarnesses.add(id);
        renderTree();
        return;
      }
      navHarness(el.dataset.hid);
    };
  });
  tree.querySelectorAll(".sRow").forEach((el) => {
    el.onclick = () => {
      openSession(el.dataset.sid);
      closeSide();
    };
  });
}

const STATUS_TAG = { ready: "运行中", starting: "启动中", awaiting: "待审批", error: "出错", saved: "已存档" };
const STATUS = { ready: "运行中", starting: "启动中", awaiting: "等授权", error: "出错", saved: "已归档" };
/* ready 只代表进程活着；跑没跑完回合看 inTurn（服务端在回合开始/结束时都会广播状态） */
function statusInfo(s) {
  if (s.status === "ready") {
    return s.inTurn ? { cls: "ready", text: "运行中" } : { cls: "idle", text: "空闲" };
  }
  return null;
}
function pillOf(s, map) {
  const si = statusInfo(s);
  if (si) return `<span class="pill ${si.cls}">${si.text}</span>`;
  return `<span class="pill ${s.status}">${map[s.status] || s.status}</span>`;
}
/* session 广播到达时就地更新各行胶囊（整列表重绘会冲掉输入框/滚动位置） */
function refreshPills(sid) {
  const s = sessions.get(sid);
  if (!s) return;
  const wrap = document.createElement("div");
  wrap.innerHTML = pillOf(s, STATUS);
  const fresh = wrap.firstElementChild;
  if (!fresh) return;
  document.querySelectorAll(`.row[data-sid="${sid}"] .pill, .sRow[data-sid="${sid}"] .pill`)
    .forEach((el) => el.replaceWith(fresh.cloneNode(true)));
}

  // 代理配置：保存/清除 → 服务端持久化到 harness.overrides.json 并广播刷新

    saveProxy(v);
  };

  if (clr) clr.onclick = () => saveProxy("");

  root.querySelectorAll(".row").forEach((el) => {
    const id = el.dataset.sid;
    el.querySelectorAll("button[data-act]").forEach((b) => {
      b.onclick = (ev) => {
        ev.stopPropagation();
        const act = b.dataset.act;
        if (act === "open") openSession(id);
        if (act === "star") {
          // 乐观更新本行按钮；服务端广播到达后侧栏/排序自然跟上（列表整页重绘会冲掉输入框，不做）
          const s = sessions.get(id);
          const v = !(s && s.starred);
          send({ type: "star", sessionId: id, starred: v });
          if (s) s.starred = v;
          b.textContent = v ? "★" : "☆";
          b.style.color = v ? "#f5b942" : "";
          b.title = v ? "取消收藏" : "收藏会话（置顶显示）";
        }
        if (act === "stop") send({ type: "close", sessionId: id });
        if (act === "resume") send({ type: "resume", sessionId: id });
        if (act === "handoff") send({ type: "handoff", sessionId: id });
        if (act === "del") { if (confirm("删除这条会话记录？（harness 侧的历史不受影响）")) send({ type: "delete", sessionId: id }); }
      };
    });
    el.onclick = () => openSession(id);
  });
}

/* ---------- 目录自动补全 ---------- */
let acInput = null, acList = null, acData = null, acActive = -1, acTimer = null;

/** 工作目录补全（VS Code 那种）：边打边列目录；不存在的路径提示可创建；圆桌向导也复用 */
function attachDirComplete(input, goBtn) {
  if (!input) return;
  const wrap = document.createElement("div");
  wrap.className = "acwrap";
  input.replaceWith(wrap);
  wrap.appendChild(input);
  const list = document.createElement("div");
  list.className = "aclist";
  list.hidden = true;
  wrap.appendChild(list);
  acInput = input; acList = list; acData = null; acActive = -1;
  /** 回车且没有高亮候选时的动作：传元素就 click()，传对象就调它的 click() */
  const submit = () => { if (!goBtn) return; if (typeof goBtn.click === "function") goBtn.click(); };

  const ask = () => {
    const reqId = Math.random().toString(36).slice(2);
    list.dataset.req = reqId;
    acActive = -1;
    send({ type: "dirs", reqId, input: input.value.trim() });
  };
  input.addEventListener("input", () => { clearTimeout(acTimer); acTimer = setTimeout(ask, 110); });
  input.addEventListener("focus", () => { clearTimeout(acTimer); acTimer = setTimeout(ask, 60); });
  input.addEventListener("blur", () => setTimeout(() => { if (acList === list) list.hidden = true; }, 130));
  input.addEventListener("keydown", (e) => {
    const open = !list.hidden && acData?.entries?.length;
    if (open && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
      e.preventDefault();
      acActive = e.key === "ArrowDown"
        ? Math.min(acActive + 1, acData.entries.length - 1)
        : Math.max(acActive - 1, -1);
      acActive >= 0 && list.querySelector(`.it[data-i="${acActive}"]`)?.scrollIntoView({ block: "nearest" });
      paintDirList();
    } else if (open && e.key === "Tab") {
      e.preventDefault();
      acceptDir(acActive >= 0 ? acActive : 0);
    } else if (e.key === "Escape") {
      list.hidden = true;
    } else if (e.key === "Enter") {
      if (open && acActive >= 0) { e.preventDefault(); acceptDir(acActive); }
      else submit();
    }
  });
}

function acceptDir(i) {
  const e = acData?.entries?.[i];
  if (!e) return;
  acInput.value = e.path + "/";
  acActive = -1;
  acInput.dispatchEvent(new Event("input"));
  acInput.focus();
}

function paintDirList() {
  if (!acList || !acData || !acList.isConnected) return;
  const frag = (acData.input || "").split("/").pop().toLowerCase();
  const re = frag ? new RegExp("(" + frag.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "i") : null;
  const rows = (acData.entries || []).map((e, i) => {
    const nm = re ? esc(e.name).replace(re, "<b>$1</b>") : esc(e.name);
    return `<div class="it ${i === acActive ? "on" : ""}" data-i="${i}">
      <span class="nm">${nm}</span>${e.git ? '<span class="badge">git</span>' : ""}</div>`;
  }).join("");
  let hint = "", cls = "";
  if (!acData.exists) { hint = "目录不存在 · 回车将创建"; cls = "create"; }
  else if (!acData.isDir) { hint = "这是文件，不是目录"; cls = "bad"; }
  else if (acData.error) { hint = "读不了这个目录：" + esc(acData.error); cls = "bad"; }
  else if (!acData.entries.length) { hint = "没有匹配的子目录"; }
  else { hint = "已存在 · 回车在该目录新建会话"; }
  acList.innerHTML = (rows || `<div class="it" style="color:var(--dim2)">（没有可补全的目录）</div>`)
    + `<div class="ft ${cls}">${hint}<span class="p">${esc(acData.dir)}</span></div>`;
  acList.querySelectorAll(".it[data-i]").forEach((el) => {
    el.onmousedown = (ev) => { ev.preventDefault(); acceptDir(Number(el.dataset.i)); };
  });
  acList.hidden = false;
}

  const s = sessions.get(id);
  if (!s) return;
  state.sessionId = id; state.harnessId = s.harnessId; state.view = "chat"; state.roomId = null;
  entries = []; nodes = []; streamingAssistant = false; transcriptBase = 0;
  // 切换会话时关掉侧抽屉：面板内容是上一个会话的，留着只会误导
  for (const pid of ["crewPanel", "wsPanel", "starPanel", "verPanel"]) { const el = $(pid); if (el) el.hidden = true; }
  render();
  send({ type: "transcript", sessionId: id });
  if (!s.live && s.resumable) {
    pushEntry({ kind: "log", text: "会话已归档，正在自动恢复…" });
    send({ type: "resume", sessionId: id });

}

/* =====================================================================
   台账渲染（Markdown 与工具卡片）
   ===================================================================== */
function inlineMd(s) {
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}

/* ---------- 数学公式（KaTeX 自托管 /static/vendor/katex/）----------
   管线：先从原文抠出数学段（$$…$$ / $…$ / \[…\] / \(…\)）换成占位符，
   走正常 mdToHtml（占位符是私有区字符，转义/行内变换都碰不到它），
   再把占位符替换成 .ktx 占位 span，MutationObserver 里用 KaTeX 挂载。
   代码块/行内代码不参与提取；$…$ 需要 ^ _ \ { } = 之一才当公式（避免 "$5 和 $10" 误伤）。 */
let katexLoading = false;
function ensureKatex() {
  if (window.katex || katexLoading) return;
  katexLoading = true;
  const link = document.createElement("link");
  link.rel = "stylesheet";
  link.href = "/static/vendor/katex/katex.min.css";
  document.head.appendChild(link);
  const s = document.createElement("script");
  s.src = "/static/vendor/katex/katex.min.js";
  s.onload = () => mountMath(document.body);
  document.head.appendChild(s);
}
function mountMath(root) {
  if (!root) return;
  const nodes = root.querySelectorAll?.(".ktx:not([data-done])") ?? [];
  if (!nodes.length) return;
  if (!window.katex) { ensureKatex(); return; }
  for (const el of nodes) {
    el.setAttribute("data-done", "1");
    const tex = el.dataset.tex || "";
    try {
      window.katex.render(tex, el, { throwOnError: false, displayMode: el.dataset.display === "1" });
    } catch { el.textContent = tex; }
  }
}
function extractMath(src) {
  const math = [];
  const ph = (tex, display) => { math.push({ tex, display }); return `\uE000${math.length - 1}\uE001`; };
  const mathish = (s) => /[\\^_{}=]/.test(s) && /[A-Za-z0-9]/.test(s);
  let text = String(src ?? "");
  // 先保护代码段（围栏与行内代码）不参与数学提取
  const codes = [];
  text = text
    .replace(/```[\s\S]*?```/g, (m) => { codes.push(m); return `\uE002${codes.length - 1}\uE003`; })
    .replace(/`[^`\n]+`/g, (m) => { codes.push(m); return `\uE002${codes.length - 1}\uE003`; });
  text = text
    .replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => ph(tex.trim(), 1))
    .replace(/\\\[([\s\S]+?)\\\]/g, (_, tex) => ph(tex.trim(), 1))
    .replace(/\\\(([\s\S]+?)\\\)/g, (_, tex) => ph(tex.trim(), 0))
    .replace(/\$([^$\n]+)\$/g, (_, tex) => (mathish(tex) ? ph(tex, 0) : _));
  text = text.replace(/\uE002(\d+)\uE003/g, (_, i) => codes[Number(i)]);
  return { text, math };
}
function restoreMathPlaceholders(html, math) {
  return html.replace(/\uE000(\d+)\uE001/g, (_, i) => {
    const m = math[Number(i)];
    if (!m) return "";
    return `<span class="ktx" data-display="${m.display}" data-tex="${esc(m.tex)}">${esc(m.tex)}</span>`;
  });
}

const mdToHtmlCore = mdToHtml;
mdToHtml = function (src) {
  const { text, math } = extractMath(src);
  const html = restoreMathPlaceholders(mdToHtmlCore(text), math);
  scheduleMathMount();
  return html;
};

let mathMountScheduled = false;
function scheduleMathMount() {
  if (mathMountScheduled) return;
  mathMountScheduled = true;
  requestAnimationFrame(() => {
    mathMountScheduled = false;
    mountMath(document.getElementById("stream"));
    mountMath(document.getElementById("viewRoot"));
    mountMath(document.getElementById("crewPanel"));
  });
}

function mdToHtml(src) {
  const lines = String(src ?? "").split("\n");
  const out = [];
  let inCode = false, lang = "", buf = [], para = [], lists = [];
  const closePara = () => { if (para.length) { out.push("<p>" + para.join("<br>") + "</p>"); para = []; } };
  const closeLists = () => { while (lists.length) out.push(lists.pop() === "ul" ? "</ul>" : "</ol>"); };
  const flushCode = () => { out.push(`<pre${lang ? ` data-lang="${esc(lang)}"` : ""}><code>${esc(buf.join("\n"))}</code></pre>`); buf = []; lang = ""; };
  for (let i2 = 0; i2 < lines.length; i2++) {
    const raw = lines[i2];
    const line = raw.replace(/\s+$/, "");
    const fence = line.match(/^\s*```\s*([\w+#.-]*)\s*$/);
    if (fence) {
      if (!inCode) { closePara(); closeLists(); inCode = true; lang = fence[1] || ""; buf = []; }
      else { flushCode(); inCode = false; }
      continue;
    }
    if (inCode) { buf.push(raw); continue; }
    if (!line.trim()) { closePara(); closeLists(); continue; }
    let m;
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) { closePara(); closeLists(); const lv = m[1].length; out.push(`<h${lv}>${inlineMd(esc(m[2]))}</h${lv}>`); continue; }
    if (/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(line)) { closePara(); closeLists(); out.push("<hr>"); continue; }
    if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) { closePara(); if (lists[lists.length - 1] !== "ul") { closeLists(); out.push("<ul>"); lists.push("ul"); } out.push(`<li>${inlineMd(esc(m[1]))}</li>`); continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { closePara(); if (lists[lists.length - 1] !== "ol") { closeLists(); out.push("<ol>"); lists.push("ol"); } out.push(`<li>${inlineMd(esc(m[1]))}</li>`); continue; }
    if ((m = line.match(/^\s*>\s?(.*)$/))) { closePara(); closeLists(); out.push(`<blockquote>${inlineMd(esc(m[1]))}</blockquote>`); continue; }
    if (isTableRow(line)) {
      closePara(); closeLists();
      const rows = [];
      while (i2 < lines.length && isTableRow(lines[i2])) { rows.push(lines[i2]); i2++; }
      out.push(tableHtml(rows));
      continue;
    }
    para.push(inlineMd(esc(line)));
  }
  if (inCode) flushCode();
  closePara(); closeLists();
  return out.join("");
}

function isTableRow(line) {
  return /^\s*\|.*\|\s*$/.test(line) && line.split("|").length >= 3;
}
function splitRow(line) {
  return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
}
function isSeparatorRow(line) {
  return /^\s*\|?\s*:?-{1,}:?\s*(\|\s*:?-{1,}:?\s*)*\|?\s*$/.test(line);
}
function tableHtml(rows) {
  const cells = rows.map(splitRow);
  const hasSep = rows.length > 1 && isSeparatorRow(rows[1]);
  const head = cells[0] || [];
  const body = hasSep ? cells.slice(2) : cells.slice(1);
  let h = '<table>';
  if (hasSep) h += "<thead><tr>" + head.map((c) => `<th>${inlineMd(esc(c))}</th>`).join("") + "</tr></thead>";
  h += "<tbody>";
  const bodyRows = hasSep ? body : (head.length ? body : []);
  if (!hasSep && head.length) h += "<tr>" + head.map((c) => `<td>${inlineMd(esc(c))}</td>`).join("") + "</tr>";
  for (const r of bodyRows) h += "<tr>" + r.map((c) => `<td>${inlineMd(esc(c))}</td>`).join("") + "</tr>";
  return h + "</tbody></table>";
}

function entryNode(e) {
  const el = document.createElement("div");
  const cls = e.kind === "assistant" ? "" : e.kind;
  el.className = "msg " + cls;
  el.innerHTML = `<div class="who">${who(e)}</div><div class="bubble"></div>`;
  paint(el, e);
  return el;
}

function who(e) {
  return { user:"you", assistant:"assistant", thought:"thinking", tool:"tool", permission:"需要授权", error:"error", log:"log" }[e.kind] || e.kind;
}

function toolIconOf(title) {
  const t = String(title || "").toLowerCase();
  if (/bash|sh|cmd|command|terminal|exec|run/i.test(t)) return "💻";
  if (/read|file|write|edit|grep|fs|patch|create/i.test(t)) return "📄";
  if (/search|web|find|query|lookup/i.test(t)) return "🔍";
  if (/subagent|agent|delegate/i.test(t)) return "🤖";
  if (/browser|url|http|fetch/i.test(t)) return "🌐";
  return "🔧";
}

function paint(el, e) {
  const b = el.querySelector(".bubble");
  if (e.kind === "tool") {
    const isDone = /completed|success|ok|finished|done/i.test(e.status);
    const isErr = /error|failed|rejected|cancelled/i.test(e.status);
    const isRunning = !isDone && !isErr;

    el.classList.toggle("done", isDone);
    el.classList.toggle("err", isErr);

    const titleText = e.title && e.title !== "tool" ? e.title : "工具调用";
    const icon = toolIconOf(titleText);
    const statusLabel = isDone ? "✓ 已完成" : isErr ? "✕ 异常" : `⏳ 运行中${e.status && e.status !== "pending" && e.status !== "in_progress" ? ` (${e.status})` : ""}`;
    const statusCls = isDone ? "st-done" : isErr ? "st-err" : "st-run";

    const hasInput = Boolean(e.detail && e.detail.trim());
    const hasOutput = Boolean(e.output && e.output.trim());
    const hasContent = hasInput || hasOutput;

    let html = `
      <div class="toolHeader" ${hasContent ? 'title="点击展开/折叠详情"' : ''}>
        <div class="toolInfo">
          <span class="toolIcon">${icon}</span>
          <span class="toolTitle">${esc(titleText)}</span>
        </div>
        <div class="toolMeta">
          <span class="toolBadge ${statusCls}">${esc(statusLabel)}</span>
          ${hasContent ? `<span class="toolChevron">▾</span>` : ""}
        </div>
      </div>`;

    if (hasContent) {
      html += `<div class="toolBody">`;
      if (hasInput) {
        html += `
          <div class="toolSec">
            <div class="toolSecLabel">输入 / 参数</div>
            <pre class="toolCode"><code>${esc(e.detail)}</code></pre>
          </div>`;
      }
      if (hasOutput) {
        html += `
          <div class="toolSec">
            <div class="toolSecLabel">执行结果</div>
            <pre class="toolCode toolOut"><code>${esc(e.output)}</code></pre>
          </div>`;
      }
      html += `</div>`;
    }

    b.innerHTML = html;

    if (hasContent) {
      const header = b.querySelector(".toolHeader");
      const body = b.querySelector(".toolBody");
      const chevron = b.querySelector(".toolChevron");

      if (e._collapsed === undefined) {
        e._collapsed = isDone && !isErr;
      }
      if (e._collapsed) {
        body.classList.add("collapsed");
        if (chevron) chevron.textContent = "▸";
      } else {
        body.classList.remove("collapsed");
        if (chevron) chevron.textContent = "▾";
      }

      header.onclick = (ev) => {
        ev.stopPropagation();
        e._collapsed = !e._collapsed;
        body.classList.toggle("collapsed", e._collapsed);
        if (chevron) chevron.textContent = e._collapsed ? "▸" : "▾";
      };
    }
  } else if (e.kind === "permission") {
    b.textContent = (e.danger ? "⚠️ " : "") + (e.task ? `【${e.task}】` : "") + (e.permKind ? `[${e.permKind}] ` : "") + e.title + (e.answered ? `  → ${e.answered}${e.auto ? "（自动决策）" : ""}` : "");
    if (e.danger) b.style.color = "var(--warn)";
    if (e.locations?.length) {
      const f = document.createElement("div");
      f.className = "meta2"; f.style.cssText = "font-size:11px;margin-top:2px";
      f.textContent = `📁 ${e.locations.join("、")}`;
      b.appendChild(f);
    }
    if (e.input) {
      const d2 = document.createElement("details");
      d2.style.cssText = "margin-top:2px";
      d2.innerHTML = `<summary style="cursor:pointer;font-size:11px;color:var(--dim2)">工具入参</summary><pre style="white-space:pre-wrap;font-size:10.5px;color:var(--dim2);margin:3px 0">${esc(e.input)}</pre>`;
      b.appendChild(d2);
    }
    if (e.context) {
      const c = document.createElement("div");
      c.className = "meta2";
      c.style.cssText = "font-size:11px;margin-top:3px";
      c.textContent = `💭 ${e.context}`;
      b.appendChild(c);
    }
    if (!e.answered && e.requestId) {
      for (const o of e.options || []) {
        const btn = document.createElement("button");
        btn.textContent = o.name + (o.kind ? ` (${o.kind})` : "");
        btn.onclick = () => { send({ type:"permission", sessionId: state.sessionId, requestId: e.requestId, optionId: o.optionId }); e.answered = o.name; paint(el, e); };
        b.appendChild(btn);
      }
    } else if (!e.answered && !e.requestId) {
      const hint = document.createElement("div");
      hint.className = "st";
      hint.textContent = "（这条授权请求来自旧版记录，已失效；给会话发一句话让它重新发起即可）";
      b.appendChild(hint);
    }
  } else if (e.kind === "assistant") {
    b.classList.add("md");
    b.innerHTML = mdToHtml(e.text ?? "");
  } else if (e.attachments?.length) {
    b.textContent = e.text ?? "";
    const t = document.createElement("div"); t.className = "meta2"; t.style.marginTop = "6px";
    t.textContent = "📎 " + e.attachments.map((a) => a.name).join(", ");
    b.appendChild(t);
  } else {
    b.textContent = e.text ?? e.message ?? "";
  }
}

function renderAll() {
  const stream = $("stream");
  if (!stream) return;
  stream.innerHTML = "";
  nodes = [];
  if (!entries.length) {
    stream.innerHTML = '<div class="empty"><div class="big">💬</div>还没有对话，说点什么吧。</div>';
    return;
  }
  nodes = entries.map((e) => { const n = entryNode(e); stream.appendChild(n); return n; });
  stream.scrollTop = stream.scrollHeight;
  transcriptBase = entries.length;
  refreshNav();
}

function pushEntry(e) {
  const stream = $("stream");
  if (!stream) return;
  if (entries.length === 0) { stream.innerHTML = ""; nodes = []; transcriptBase = 0; }
  entries.push(e);
  const n = entryNode(e);
  nodes.push(n);
  stream.appendChild(n);
  // 自己发的消息总是滚到底；agent 的流式输出只在本来就在底部附近时才跟随（读历史不被拽走）
  if (e.kind === "user" || !window.__nearBottom || window.__nearBottom(stream)) stream.scrollTop = stream.scrollHeight;
  refreshNav();
  return n;
}

function textOfUpdate(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (Array.isArray(v)) return v.map(textOfUpdate).filter(Boolean).join("\n");
  if (typeof v === "object") {
    if (typeof v.text === "string") return v.text;
    if (v.content !== undefined) return textOfUpdate(v.content);
    try { return JSON.stringify(v, null, 2); } catch { return ""; }
  }
  return String(v);
}

function formatFrontToolTitle(u) {
  let title = typeof u.title === "string" && u.title.trim() ? u.title.trim() : "";
  const name = typeof u.name === "string" ? u.name : typeof u.toolName === "string" ? u.toolName : typeof u.kind === "string" && u.kind !== "tool" ? u.kind : "";
  if (!title && name) title = name;
  if (!title) title = "tool";

  const raw = u.rawInput ?? u.input;
  if (raw && typeof raw === "object") {
    const cmd = raw.command ?? raw.cmd ?? raw.script;
    const file = raw.path ?? raw.file_path ?? raw.filePath ?? raw.file ?? raw.target_file;
    const query = raw.query ?? raw.pattern ?? raw.regex;
    const url = raw.url ?? raw.uri;
    if (typeof cmd === "string" && cmd.trim()) {
      const short = cmd.trim().split("\n")[0]?.slice(0, 60) ?? "";
      if (short && !title.includes(short)) title = `${name || title}: ${short}`;
    } else if (typeof file === "string" && file.trim()) {
      if (!title.includes(file)) title = `${name || title}: ${file}`;
    } else if (typeof query === "string" && query.trim()) {
      if (!title.includes(query)) title = `${name || title}: "${query.slice(0, 40)}"`;
    } else if (typeof url === "string" && url.trim()) {
      if (!title.includes(url)) title = `${name || title}: ${url.slice(0, 50)}`;
    }
  }
  return title;
}

function updateLast() {
  const i = entries.length - 1;
  if (i >= 0 && nodes[i]) paint(nodes[i], entries[i]);
  const stream = $("stream");
  if (stream && (!window.__nearBottom || window.__nearBottom(stream))) stream.scrollTop = stream.scrollHeight;
}

let searchPos = -1;

function entrySearchText(e) {
  if (e.kind === "user" || e.kind === "assistant" || e.kind === "thought") return String(e.text ?? "");
  if (e.kind === "tool") return String(e.title ?? "");
  if (e.kind === "permission") return String(e.title ?? "");
  return "";
}

/* 正文关键词标黄：直接在 DOM 文本节点上包 <mark>，不干扰 markdown 渲染；
   重渲染（流式更新）会冲掉标黄，下次搜索会重新标——可接受 */
function clearKwMarks() {
  document.querySelectorAll("mark.kw").forEach((m) => {
    const parent = m.parentNode;
    if (!parent) return;
    parent.replaceChild(document.createTextNode(m.textContent ?? ""), m);
    parent.normalize();
  });
}

function markKeywordsIn(node, needle) {
  const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
  const targets = [];
  while (walker.nextNode()) {
    if (walker.currentNode.nodeValue?.toLowerCase().includes(needle)) targets.push(walker.currentNode);
  }
  for (const text of targets) {
    let rest = text;
    for (;;) {
      const idx = rest.nodeValue.toLowerCase().indexOf(needle);
      if (idx < 0) break;
      const hitText = rest.splitText(idx);
      const tail = hitText.splitText(needle.length);
      const mark = document.createElement("mark");
      mark.className = "kw";
      mark.textContent = hitText.nodeValue;
      hitText.parentNode?.replaceChild(mark, hitText);
      rest = tail;
      if (!rest.nodeValue) break;
    }
  }
}

/* 搜索结果面板：像 VS Code 搜索那样，把每条命中行列成下拉，点击跳到那条消息 */
let searchResults = [];   // [{ i: entries 下标, line: 命中行文本 }]

function speakerOf(e) {
  if (e.kind === "user") return "你";
  if (e.kind === "thought") return "思考";
  if (e.kind === "tool") return "工具";
  if (e.kind === "permission") return "授权";
  return sessions.get(state.sessionId)?.harnessLabel ?? "AI";
}

/** 从一段文本里抠出命中行；超长行截成「…前文 + 命中 + 后文…」 */
function matchLines(text, needle, maxLines = 4) {
  const out = [];
  for (const line of String(text).split("\n")) {
    if (out.length >= maxLines) break;
    const idx = line.toLowerCase().indexOf(needle);
    if (idx < 0) continue;
    const from = Math.max(0, idx - 18);
    const to = Math.min(line.length, idx + needle.length + 30);
    out.push((from > 0 ? "…" : "") + line.slice(from, to) + (to < line.length ? "…" : ""));
  }
  return out;
}

function escWithKw(s, needle) {
  const parts = [];
  let rest = s;
  for (;;) {
    const idx = rest.toLowerCase().indexOf(needle);
    if (idx < 0) { parts.push(esc(rest)); break; }
    parts.push(esc(rest.slice(0, idx)), `<span class="kwhl">${esc(rest.slice(idx, idx + needle.length))}</span>`);
    rest = rest.slice(idx + needle.length);
  }
  return parts.join("");
}

function renderSearchDrop() {
  const box = $("searchDrop");
  const input = $("chatSearch");
  if (!box || !input) return;
  const q = input.value.trim().toLowerCase();
  if (!q) { box.hidden = true; box.innerHTML = ""; return; }
  if (!searchResults.length) {
    box.innerHTML = '<div class="dropEmpty">无匹配</div>';
    box.hidden = false;
    return;
  }
  box.innerHTML = searchResults
    .slice(0, 60)
    .map((r, n) => `<div class="dropItem${r.i === searchHits[searchPos] ? " on" : ""}" data-i="${r.i}" data-n="${n}">
      <span class="who">${esc(speakerOf(entries[r.i]))}</span>
      <span class="ln">${escWithKw(r.line, q)}</span>
    </div>`)
    .join("") + (searchResults.length > 60 ? '<div class="dropEmpty">… 仅显示前 60 条命中行</div>' : "");
  box.querySelectorAll(".dropItem").forEach((el) => {
    el.onmousedown = (ev) => {   // mousedown 抢在 blur 之前
      ev.preventDefault();
      gotoEntry(Number(el.dataset.i));
    };
  });
  const on = box.querySelector(".dropItem.on");
  if (on) on.scrollIntoView({ block: "nearest" });
  box.hidden = false;
}

function gotoEntry(i) {
  const pos = searchHits.indexOf(i);
  if (pos >= 0) gotoHit(pos);
  else { nodes[i]?.classList.add("cur"); jumpTo(i); }
}

function runSearch(q) {
  document.querySelectorAll(".msg.hit, .msg.cur").forEach((el) => el.classList.remove("hit", "cur"));
  clearKwMarks();
  searchHits = [];
  searchResults = [];
  searchPos = -1;
  const cnt = $("searchCount");
  const needle = q.trim().toLowerCase();
  if (!needle) { if (cnt) cnt.textContent = ""; renderSearchDrop(); return; }
  entries.forEach((e, i) => {
    const text = entrySearchText(e);
    if (!text.toLowerCase().includes(needle)) return;
    searchHits.push(i);
    nodes[i]?.classList.add("hit");
    markKeywordsIn(nodes[i], needle);
    for (const line of matchLines(text, needle)) searchResults.push({ i, line });
  });
  if (!cnt) return;
  if (!searchHits.length) { cnt.textContent = "无匹配"; renderSearchDrop(); return; }
  cnt.textContent = `${searchHits.length} 处`;
  renderSearchDrop();   // 只列结果，不跳转——跳转由点结果 / Enter / ▲▼ 触发
}

function gotoHit(k) {
  if (!searchHits.length) return;
  searchPos = ((k % searchHits.length) + searchHits.length) % searchHits.length;
  document.querySelectorAll(".msg.cur").forEach((el) => el.classList.remove("cur"));
  const i = searchHits[searchPos];
  nodes[i]?.classList.add("cur");
  jumpTo(i);
  const cnt = $("searchCount");
  if (cnt) cnt.textContent = `${searchPos + 1}/${searchHits.length}`;
  renderSearchDrop();   // 同步下拉里的当前项
}

function applyUpdate(u) {
  if (u.sessionUpdate === "agent_message_chunk" && u.content?.type === "text") {
    const last = entries[entries.length - 1];
    if (last?.kind === "assistant" && streamingAssistant) { last.text += u.content.text; updateLast(); }
    else { streamingAssistant = true; pushEntry({ kind:"assistant", text: u.content.text }); }
  } else if (u.sessionUpdate === "agent_thought_chunk" && u.content?.type === "text") {
    const last = entries[entries.length - 1];
    if (last?.kind === "thought") { last.text += u.content.text; updateLast(); }
    else pushEntry({ kind:"thought", text: u.content.text });
  } else if (u.sessionUpdate === "tool_call" || u.sessionUpdate === "tool_call_update") {
    streamingAssistant = false;
    const id = String(u.toolCallId ?? u.id ?? "");
    const title = formatFrontToolTitle(u);
    const rawInp = u.rawInput ?? u.input;
    const rawOut = u.rawOutput ?? u.output ?? u.content;
    const inpStr = rawInp ? textOfUpdate(rawInp) : "";
    const outStr = rawOut ? textOfUpdate(rawOut) : "";

    const found = entries.find((e) => e.kind === "tool" && (e.toolCallId === id || (!id && e === entries[entries.length - 1])));
    if (found) {
      if (u.status) found.status = String(u.status);
      if (title && title !== "tool") found.title = title;
      if (inpStr && inpStr !== "{}") found.detail = inpStr;
      if (outStr) {
        if (!found.output) found.output = outStr;
        else if (!found.output.endsWith(outStr)) found.output = (found.output + "\n" + outStr).slice(-4000);
      }
      const i = entries.indexOf(found);
      if (nodes[i]) paint(nodes[i], found);
    } else {
      pushEntry({
        kind: "tool",
        toolCallId: id,
        title,
        status: String(u.status ?? "in_progress"),
        detail: inpStr && inpStr !== "{}" ? inpStr : undefined,
        output: outStr || undefined,
      });
    }
  } else if (u.sessionUpdate === "hg_noop_turn") {
    const el = pushEntry({ kind: "error", message: u.message });
    if (el) {
      const btn = document.createElement("button");
      btn.className = "mini primary";
      btn.style.marginTop = "9px";
      btn.textContent = "在新会话里接续";
      btn.onclick = () => send({ type: "handoff", sessionId: state.sessionId });
      el.querySelector(".bubble").appendChild(document.createElement("br"));
      el.querySelector(".bubble").appendChild(btn);
    }
  } else if (u.sessionUpdate === "hg_queued") {
    pushEntry({ kind:"log", text:`⏳ 会话启动中，这条消息已排队（第 ${u.queueLength ?? "?"} 条），就绪后自动发送` });
  } else if (u.sessionUpdate === "hg_error") {
    const isProvider = /provider|upstream|rate limit|quota|APIError/i.test(String(u.message || ""));
    const el = pushEntry({ kind:"error", message: u.message + (isProvider ? "\n\n（看起来是模型供应商侧的故障：可以在顶栏 Model 换个模型重试，或稍后再发一次）" : "") });
    if (isProvider && el) {
      const btn = document.createElement("button");
      btn.className = "mini"; btn.style.marginTop = "8px"; btn.textContent = "换个模型重试";
      btn.onclick = () => { const s2 = $("cfg"); const sel = s2 && s2.querySelector("select"); if (sel) { const opts = [...sel.options].map(o => o.value).filter(v => v !== sel.value); if (opts.length) { sel.value = opts[0]; sel.onchange(); pushEntry({kind:"log", text:"已切到模型 " + opts[0] + "，重新发送即可"}); return; } } pushEntry({ kind:"log", text:"请在顶栏 Model 下拉里换个模型" }); };
      el.querySelector(".bubble").appendChild(document.createElement("br"));
      el.querySelector(".bubble").appendChild(btn);
    }
  } else if (showLog) {
    pushEntry({ kind:"log", text: `[${u.sessionUpdate}] ${JSON.stringify(u).slice(0, 300)}` });
  }
}

/* =====================================================================
   发送 / 附件
   ===================================================================== */
const MAX_ATTACH = 5 * 1024 * 1024;
function renderChips() {
  const box = $("chips");
  if (!box) return;
  box.innerHTML = "";
  pendingFiles.forEach((f, i) => {
    const el = document.createElement("span");
    el.className = "chip";
    el.innerHTML = (f.mimeType.startsWith("image/") ? `<img src="data:${f.mimeType};base64,${f.data}" alt="">` : "") + `<span>${esc(f.name)}</span>`;
    const x = document.createElement("button"); x.textContent = "✕"; x.className = "ghost"; x.style.border = "none"; x.style.padding = "0 2px";
    x.onclick = () => { pendingFiles.splice(i, 1); renderChips(); };
    el.appendChild(x); box.appendChild(el);
  });
}
$("fileInput").onchange = async (ev) => {
  for (const file of ev.target.files || []) {
    if (file.size > MAX_ATTACH) { alert(`${file.name} 超过 5MB，暂不支持`); continue; }
    const ok = file.type.startsWith("image/") || file.type.startsWith("text/") || file.type === "application/json";
    if (!ok) { alert(`${file.name}: 目前只支持图片与文本附件`); continue; }
    const buf = new Uint8Array(await file.arrayBuffer());
    let bin = ""; for (const b of buf) bin += String.fromCharCode(b);
    pendingFiles.push({ name: file.name, mimeType: file.type || "application/octet-stream", data: btoa(bin) });
  }
  ev.target.value = "";
  renderChips();
};

function doSend() {
  const inp = $("input");
  const text = (inp?.value || "").trim();
  if (!text && !pendingFiles.length) return;
  const s = sessions.get(state.sessionId);
  if (!s) return;
  if (!s.live) { alert("会话未在运行：先点顶部的「恢复会话」"); return; }
  inp.value = "";
  streamingAssistant = false;
  const atts = pendingFiles.slice();
  if (!s.title) { s.title = text.slice(0, 40); renderTree(); }
  pushEntry({ kind:"user", text, attachments: atts.map((a) => ({ name:a.name, mimeType:a.mimeType })) });
  if (!send({ type:"prompt", sessionId: state.sessionId, text, attachments: atts })) {
    pushEntry({ kind:"error", message:"连接已断开，这条消息没有发出去（正在自动重连，稍后重发即可）" });
  }
  pendingFiles = []; renderChips();
}

  const p = $("wsPanel");

function renderWorkspace(reports) {
  const p = $("wsPanel");
  if (p.hidden) return;
  if (!reports?.length) { p.innerHTML = `<div class="hd"><b>工作区</b><button class="mini ghost" onclick="document.getElementById('wsPanel').hidden=true">关闭</button></div><div class="empty">还没有活跃工作区</div>`; return; }
  let html = `<div class="hd"><b>工作区</b><button class="mini ghost" onclick="document.getElementById('wsPanel').hidden=true">关闭</button></div>`;
  for (const r of reports) {
    html += `<h3>${esc(r.cwd)}</h3><div class="meta2" style="margin-bottom:8px">${esc(r.note)}</div>`;
    html += `<h3>会话（${r.sessions.length}）</h3>`;
    for (const s of r.sessions) {
      html += `<div class="wsRow"><div>${esc(s.harnessLabel)} <span class="badge">${s.mode === "worktree" ? "worktree " + esc(s.branch || "") : "共享目录"}</span>${s.inTurn ? '<span class="badge warn">正在干活</span>' : ""}</div>
        <div class="meta2">#${s.id} · ${esc(s.cwd)}${s.changedFiles?.length ? ` · 改动 ${s.changedFiles.length} 个` : ""}</div>
        ${s.diffStat ? `<pre style="white-space:pre-wrap;font-size:11px;color:var(--dim2);margin:6px 0 0">${esc(s.diffStat)}</pre>` : ""}</div>`;
    }
    html += `<h3>文件（${r.files.length}${r.conflicts ? `，冲突 ${r.conflicts}` : ""}）</h3>`;
    for (const f of r.files.slice(0, 80)) {
      const who = [...new Set(f.touches.map((t) => t.harnessId))].join(" + ");
      html += `<div class="wsRow ${f.conflict ? "conflict" : ""}">
        <div>${f.conflict ? "⚠️ " : ""}${esc(f.rel)} <span class="badge">${f.touches.length} 次</span> <span class="badge ${f.conflict ? "warn" : ""}">${esc(who)}</span></div>
        <div class="meta2">最后改动 ${new Date(f.lastTs).toLocaleTimeString()} · 归因 ${esc(f.touches[f.touches.length - 1]?.confidence || "?")}</div></div>`;
    }
  }
  p.innerHTML = html;
