name: harnessgate
description: HarnessGate 移动客户端——远程驱动服务器上的编码 agent
publish_to: "none"
version: 0.6.21+25

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.2
  flutter_markdown: ^0.7.4
  flutter_math_fork: ^0.7.2
  markdown: ^7.2.2
  # 应用内自更新：查 GitHub Release / 下载 APK / 调起安装 / 读运行时版本
  http: ^1.2.2
  open_filex: ^4.5.0
  package_info_plus: ^8.0.2
  # 对话附件（选图发送）与改动文件下载
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  # 本地通知：回合完成 / 等待授权时提醒（APP 进程存活期间）
  flutter_local_notifications: ^19.0.0
  # 语音输入：系统 SpeechRecognizer（国内主流 ROM 内置识别引擎）
  speech_to_text: ^7.0.0
  # 语音：服务端本地识别/TTS 的配套——流式 PCM 采集（通话）与音频播放（朗读/通话回传）
  # 7.x：5.x 的 linux 实现与 platform_interface 版本求解会打架（上游问题），直接上 7
  record: ^7.1.1
  just_audio: ^0.9.40

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
