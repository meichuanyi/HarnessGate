# dsh-harnessgate bundle patch：在宿主树上插入 HarnessGate 行。
# 作为 bundle 引用时（profile package.json 的 dsh.profile.bundles 加 "dsh-harnessgate"），
# 本文件随 dsh.bundle.patch 清单生效；也可只把下面 insert 段抄进 profile 的 cordis.patch.yml。
- insert:
    - id: harnessgate
      name: 'dsh-harnessgate'
      config:
        # HarnessGate 服务器与 token；默认读本机 ~/.harnessgate/token
        url: 'http://127.0.0.1:9830'
        # token: ''            # 显式指定 token 时覆盖 tokenFile
        # tokenFile: '~/.harnessgate/token'
        panelPath: '/harnessgate'
